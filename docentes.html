const BOOK_DATA = {"parts":[{"id":1,"label":"PRIMERA PARTE","title":"Infancia, Juventud y Preparación a su Misión","subtitle":"Orígenes familiares, pruebas de la niñez, el Sueño de los 9 años, formación estudiantil en Chieri, discernimiento y vida en el Seminario (1815-1844)"},{"id":2,"label":"SEGUNDA PARTE","title":"La Obra de Don Bosco y los Años del Oratorio","subtitle":"El inicio con Bartolomé Garelli, el Oratorio ambulante, Casa Pinardi, Mamá Margarita, los primeros salesianos y la expansión del carisma (1841-1888)"},{"id":3,"label":"TERCERA PARTE","title":"San Juan Bosco en el Mundo","subtitle":"Sucesores de Don Bosco al frente de la Congregación, expansión global, Sistema Preventivo y canonización"},{"id":4,"label":"CUARTA PARTE","title":"Pensamientos Pedagógicos de San Juan Bosco","subtitle":"Máximas espirituales, la pedagogía de la alegría, sacramentos de Confesión y Eucaristía, y el lema \u0027Trabajo y Templanza\u0027"},{"id":5,"label":"QUINTA PARTE","title":"Los Salesianos de México y la Inspectoría","subtitle":"Llegada de los primeros misioneros, fundaciones históricas, inspectorías de México y etapas de formación"}],"questions":[{"num":1,"part":1,"q":"¿Cuándo y dónde nació San Juan Bosco?","a":"San Juan Bosco nació el 16 de agosto de 1815 en I´Becchi, caserío situado entre Castelnuovo y Capriglio en la diócesis de Asti, en el Piamonte, Italia."},{"num":2,"part":1,"q":"¿Quiénes fueron los padres de Juanito Bosco?","a":"Los padres de Juanito Bosco fueron: FRANCISCO BOSCO y MARGARITA OCCHIENA, modestos campesinos."},{"num":3,"part":1,"q":"¿Cuándo y dónde fue bautizado San Juan Bosco?","a":"San Juan Bosco fue bautizado al día siguiente de su nacimiento, en Castelnuovo con el nombre de Juan Melchor."},{"num":4,"part":1,"q":"¿Qué acontecimientos recuerda el año 1815, en que nació San Juan Bosco?","a":"El año de 1815, en que nació San Juan Bosco, recuerda los siguientes sucesos históricos y religiosos:\n• La caída definitiva de Napoleón Bonaparte.\n• El regreso del Rey a Turín.\n• La liberación del Papa Pío VII por los franceses.\n• La institución de la fiesta de María Auxiliadora por el mismo Papa Pío VII."},{"num":5,"part":1,"q":"¿Cuándo perdió Juan Bosco a su padre?","a":"Juan Bosco perdió a su padre el 11 de mayo de 1817, cuando Juanito aún no cumplía dos años de edad."},{"num":6,"part":1,"q":"¿Tuvo hermanos Juanito Bosco?","a":"Juanito Bosco sí tuvo hermanos y fueron:\n• ANTONIO, su medio hermano.\n• JOSÉ, hijo al igual que Juan, del segundo matrimonio de Francisco Bosco.\n• Tuvo además una media hermana, TERESA, a la que ni conoció, pues murió pequeña antes de que él naciera."},{"num":7,"part":1,"q":"¿Cómo pasó Juanito Bosco los primeros años de su vida?","a":"Juanito Bosco pasó los primeros años de su vida ayudando a su madre a labrar la tierra, pastoreando y sirviendo de mozo, y por la noche estudiando el catecismo."},{"num":8,"part":1,"q":"¿Qué gran prueba familiar y social enfrentó Mamá Margarita tras la muerte de Francisco Bosco en 1817?","a":"Enfrentó la terrible carestía y hambruna de 1817 que asoló al Piamonte. Tras superar esa penuria, Margarita recibió una ventajosa propuesta de matrimonio que le aseguraba estabilidad y desahogo, pero la rechazó tajantemente respondiendo: «Dios me dio un marido y Dios me lo quitó. Tres hijos me dejó al morir, y yo sería una madre sin corazón si los abandonase cuando más me necesitan»."},{"num":9,"part":1,"q":"¿Por qué tuvo que salir Juanito de su hogar entre febrero de 1828 y noviembre de 1829 para trabajar en la hacienda de los Moglia en Moncucco?","a":"Debido a los constantes roces con su hermanastro Antonio, quien no toleraba que Juan estudiara y le exigía dedicarse de lleno a las labores agrícolas. Para salvaguardar la paz familiar, su madre lo colocó como mozo de campo con la familia de Luis Moglia en Moncucco. Allí, los domingos por la tarde, Juanito reunía a los muchachos y muchachas de los contornos en el henil y, trepado sobre un montón de hierba, les enseñaba el catecismo."},{"num":10,"part":1,"q":"¿Qué edad tenía Juanito Bosco cuando Dios le manifestó su misión?","a":"Juanito Bosco tenía nueve años de edad cuando Dios le manifestó su misión por medio de un sueño."},{"num":11,"part":1,"q":"¿Qué le indicó Dios a Juanito en su primer sueño?","a":"En su primer sueño Dios le indicó a Juanito Bosco que creciera FUERTE en la virtud y que fuera MANSO Y HUMILDE, porque con la ayuda de la Santísima Virgen debería consagrar su vida a la salvación de la juventud pobre y abandonada."},{"num":12,"part":1,"q":"¿Cómo se presentó el «Personaje» en el sueño de los nueve años y cuál fue la primera instrucción que dio a Juanito?","a":"Se presentó como un hombre venerable, de porte varonil, noblemente vestido con un manto blanco y un rostro tan resplandeciente que no se le podía mirar de frente. Al ver que Juanito se lanzaba a puñetazos e insultos para acallar a los muchachos que blasfemaban, el Personaje lo llamó por su nombre y le ordenó: «A estos amigos tuyos no los vas a ganar con los golpes, sino con la mansedumbre y la caridad. Empieza ahora mismo a enseñarles la fealdad del pecado y la hermosura de la virtud»."},{"num":13,"part":1,"q":"¿Qué diálogo sostuvieron Juanito y el Personaje del sueño acerca de su identidad y la Maestra prometida?","a":"Juanito, asustado y confuso, le replicó que era un niño ignorante incapaz de hablar de religión y le preguntó su nombre. El Señor le respondió: «Precisamente porque te parecen imposibles debes hacerlas posibles con la obediencia y adquiriendo la ciencia necesaria... Te daré la Maestra bajo cuya guía podrás llegar a ser sabio». Y al insistir Juanito en conocer su identidad, concluyó: «Soy el hijo de Aquella a quien tu madre te acostumbró a saludar tres veces al día con el Ángelus»."},{"num":14,"part":1,"q":"¿Qué significado profético tiene la transformación de las fieras en corderos y pastores en el sueño de los 9 años?","a":"Es la síntesis teológica y pedagógica del carisma salesiano: muestra cómo la gracia de Cristo y la pedagogía del amor transforman a los jóvenes rebeldes, agresivos y marginados (fieras) en almas dóciles y creyentes (corderos). Asimismo, profetiza que de entre esos mismos muchachos descarriados suscitaría Dios a futuros pastores, educadores y salesianos que consagrarían su vida a guiar a la juventud."},{"num":15,"part":1,"q":"¿En qué momentos sucesivos de la vida de San Juan Bosco se repitió el sueño fundamental de su vocación?","a":"Según las fuentes críticas y las Memorias del Oratorio, el sueño fundamental se repitió a los 11, 16, 19, 21, 30, 31 y 72 años de edad (en Barcelona, 1886). El sueño fue evolucionando desde el escenario campestre de I\u0027 Becchi hasta explanadas urbanas en Turín (1844-1845), donde vio la Iglesia de San Francisco de Sales y la Basílica de María Auxiliadora, extendiéndose finalmente a una grey universal en América, Asia y África."},{"num":16,"part":1,"q":"¿Cuántos sueños de San Juan Bosco se encuentran narrados en las “Memorias Biográficas”?","a":"Solamente 153 sueños de San Juan Bosco se encuentran narrados en las “Memorias Biográficas”."},{"num":17,"part":1,"q":"¿Qué son las “Memorias Biográficas” de San Juan Bosco y cuántos tomos comprenden?","a":"Las “Memorias Biográficas” de San Juan Bosco son 18 tomos donde se encuentran sus escritos y datos de primera mano."},{"num":18,"part":1,"q":"¿Quiénes son los autores de las “Memorias Biográficas” de San Juan Bosco?","a":"Los autores de las “Memorias Biográficas” de San Juan Bosco son: el P. LEMOYNE, el P. AMADEI y DON CERIA."},{"num":19,"part":1,"q":"¿Cuándo empezó Juanito Bosco a frecuentar la escuela y con qué dificultades?","a":"Juanito empezó a frecuentar la escuela a los diez años de edad y con grandes dificultades como:\n• El clima invernal riguroso.\n• La distancia considerable de I´Becchi a Capriglio donde se encontraba la escuela.\n• Y la oposición de su hermano Antonio, que no quería que estudiara sino que se dedicara al campo."},{"num":20,"part":1,"q":"¿A que se dedicaba Juanito Bosco en su tiempo libre?","a":"Juanito Bosco en su tiempo libre se dedicaba a estudiar preparándose para ser un día sacerdote, pues sus recursos económicos no le permitían asistir a la escuela fácilmente."},{"num":21,"part":1,"q":"¿Cuándo empezó Juanito Bosco su vida apostólica?","a":"Juanito Bosco empezó su vida apostólica desde pequeño con su vida cristiana ejemplar, y también con sus habilidades de pequeño saltimbanqui de las que se aprovechaba para hacer una repetición del sermón del sacerdote, o para rezar el rosario entre sus amigos."},{"num":22,"part":1,"q":"¿Cómo organizaba Juanito sus funciones dominicales al aire libre en I\u0027 Becchi a los diez años?","a":"Templaba una maroma entre dos árboles del bosque, colocaba una mesita con su mochila de prestidigitador y una alfombra para sus saltos acrobáticos. Cuando el público campesino estaba congregado, los invitaba a rezar la tercera parte del rosario y entonar un himno; luego se subía a una silla para repetirles con precisión el sermón escuchado por la mañana en la parroquia, y finalmente ejecutaba malabares, equilibrios y la prueba de la «golondrina»."},{"num":23,"part":1,"q":"¿En qué año fue aceptado Juanito Bosco a la Primera Comunión?","a":"Juanito Bosco fue admitido a la Primera Comunión en el año de 1826 por el Arcipreste de Butigliera de Asti, como excepción a las grandes virtudes del pequeño, ya que en aquel tiempo sólo se les aceptaba más grandes."},{"num":24,"part":1,"q":"¿Cuándo recibió Juan Bosco la Confirmación?","a":"Juan Bosco recibió el Sacramento de la Confirmación siendo un joven de 18 años, el 4 de agosto de 1833."},{"num":25,"part":1,"q":"¿Qué persona entra a formar parte de la vida de Juanito Bosco en la misión de Butigliera de Asti en 1826 [noviembre de 1829]?","a":"En la misión de Butigliera de Asti en 1826, entra a formar parte de la vida de Juanito Bosco el párroco de Murialdo Don JOSÉ CALOSSO, máximo cooperador y orientador de su vocación sacerdotal."},{"num":26,"part":1,"q":"¿Qué asombroso diálogo sostuvieron Juanito Bosco y Don Calosso al regreso de la misión de Buttigliera?","a":"Don Calosso, creyendo que el niño no habría comprendido la prédica de los misioneros, le ofreció veinte céntimos si le repetía cuatro ideas. Juanito le expuso el tema central («la necesidad de convertirse a Dios sin dilación») y le repitió de memoria el sermón íntegro con su exordio y los tres puntos doctrinales. El anciano sacerdote quedó admirado de su prodigiosa retentiva y resolvió encargarse personalmente de su formación latina y sacerdotal."},{"num":27,"part":1,"q":"¿Qué hizo Juan Bosco con la llave del dinero que Don Calosso le confió antes de expirar el 21 de noviembre de 1830?","a":"Al ser herido por una apoplejía fulminante que le impidió hablar, Don Calosso le entregó en mano a Juan la llave de su caja dejándole todo su dinero para sus estudios. Sin embargo, en un acto de heroico desprendimiento y para evitar cualquier sombra de discordia o sospecha con los parientes legítimos del sacerdote, Juan entregó la llave a los herederos renunciando íntegramente al dinero."},{"num":28,"part":1,"q":"¿Qué motivo llevó a Juanito Bosco a abandonar su hogar, después de conocer a Don Calosso?","a":"Fue el constante roce con su hermanastro Antonio, y se fue a servir a casa de los Moglia."},{"num":29,"part":1,"q":"¿Qué era lo que más le gustaba estudiar a Juanito Bosco?","a":"A Juanito Bosco le gustaba estudiar todo lo que le ayudara a ser sacerdote, y así, además, aprendió a labrar la tierra, a tejer cestos, a hacer jaulas, etc. Y pudo más tarde ayudarse con esto a sus estudios."},{"num":30,"part":1,"q":"¿Terminados sus estudios en Castelnuovo, qué hizo Juanito Bosco para poder asistir a la segunda enseñanza?","a":"Terminados sus estudios en Castelnuovo, para poder asistir a la Segunda enseñanza, Juanito Bosco se trasladó a Chieri en 1831."},{"num":31,"part":1,"q":"¿Qué célebre frase pronunció el profesor José Cima cuando Juan Bosco ingresó a mitad de curso al Gimnasio de Chieri?","a":"Al ver entrar al aula a un estudiante tan alto y fornido entre compañeros mucho más jóvenes, el severo profesor Cima exclamó con ironía ante toda la clase: «¿Qué dicen?, o éste es una marmota o es un genio». Juan demostró ser un genio aprobando brillantemente las materias en tiempo récord y ganándose el respeto de maestros y alumnos."},{"num":32,"part":1,"q":"¿Qué hacía Juan Bosco mientras estudiaba el bachillerato?","a":"Mientras estudiaba el bachillerato, Juan Bosco desempeñó varios oficios como sastrería, herrería, zapatería y otros, además, cultivó amistades entre sus compañeros y fundó el “Club de la Alegría”."},{"num":33,"part":1,"q":"¿Qué oficios aprendió Juan Bosco mientras laboraba en el Café de José Pianta en Chieri?","a":"En sus horas libres aprendió los secretos de la pastelería y la licorería: preparaba café, chocolates de mesa, dulces finos, refrescos, helados y licores. Llegó a tal dominio que el señor Pianta le ofreció asociarlo formalmente al negocio con ventajosas condiciones, propuesta que Juan rechazó con gratitud para mantenerse fiel a su meta hacia el sacerdocio."},{"num":34,"part":1,"q":"¿Cómo venció Juan Bosco a un saltimbanqui profesional en una carrera pública en Chieri?","a":"Ante las jactancias de un atleta profesional que desafiaba a toda la ciudad, Juan apostó correr desde la Vía Maestra hasta la Puerta de Turín. Juan le ganó con amplísima ventaja. En lugar de cobrar los 20 francos acordados, le propuso con espíritu festivo perdonarle la deuda si costeaba una comida para veintidós estudiantes en la fonda del Muletto."},{"num":35,"part":1,"q":"¿Quién fue el joven hebreo Jacobo Leví («Jonás») y qué papel desempeñó Juan Bosco en su conversión?","a":"Fue un joven judío con quien Juan entabló una sólida amistad en el Café Pianta de Chieri. Juan lo instruyó con caridad en los fundamentos del Evangelio, superó la hostilidad y amenazas del gueto de Chieri y lo acompañó fraternalmente hasta su solemne bautismo en la catedral de Santa María de la Escala, donde tomó el nombre de Luis Bolmida."},{"num":36,"part":1,"q":"¿Cómo demostró Juan Bosco al canónigo Burzio que sus habilidades lúdicas no procedían de hechicería ni del demonio?","a":"Debido a que el sastre Tomás Cumino sospechaba que Juan usaba magia negra, el arcipreste Burzio lo citó para interrogarlo. Con ingenio y rapidez de manos, Juan hizo aparecer la cartera y el reloj del canónigo debajo de una pantalla de mesa mientras este creía tenerlos consigo. Al comprobar que era pura destreza y física recreativa, el canónigo rió satisfecho, lo premió y sentenció: «La ignorancia es la madre del asombro»."},{"num":37,"part":1,"q":"¿Qué advertencia formuló Don Bosco en sus Memorias acerca de la lectura apasionada de los clásicos paganos en Chieri?","a":"Constató que la inmersión acrítica en los poetas y filósofos del paganismo clásico puede alimentar la vanagloria, mundanizar los sentimientos y restar gusto por la lectura espiritual y las Sagradas Escrituras si el estudio no está regido por la fe cristiana y la pureza de intención."},{"num":38,"part":1,"q":"¿Cuál fue el reglamento que Juan Bosco redactó para el “Club de la Alegría”?","a":"El reglamento que Juan Bosco redactó para el “Club de la Alegría” fue el siguiente:\n• 1: Cada socio del Club de la Alegría debe evitar en su conducta cuanto desdiga de un buen cristiano.\n• 2: Se esforzará en cumplir como el mejor de todos sus deberes escolares y religiosos."},{"num":39,"part":1,"q":"¿Qué grave encrucijada vocacional enfrentó Juan Bosco al concluir sus estudios de Humanidades en 1834?","a":"Temiendo que en el clero secular pudiera poner en riesgo la salvación de su alma, solicitó formalmente el ingreso en la Orden de los Frailes Menores Franciscanos en el Convento de Santa María de la Paz de Chieri, siendo admitido. Sin embargo, tras un sueño en que veía religiosos con hábitos rotos que le advertían que Dios le preparaba otro campo de trabajo, y aconsejado por su confesor y su amigo Luis Comollo, resolvió ingresar al Seminario diocesano."},{"num":40,"part":1,"q":"¿Qué propósitos ascéticos redactó el clérigo Juan Bosco en vísperas de vestir la sotana el 25 de octubre de 1835?","a":"Redactó un exigente reglamento de siete compromisos:\n• 1: No participar en espectáculos públicos, ferias, teatros, bailes ni banquetes mundanos.\n• 2: No hacer juegos de manos, prestidigitación, acrobacias, violín ni cacería.\n• 3: Guardar estricto recogimiento y sobriedad en la comida y el descanso.\n• 4: Consagrar sus lecturas únicamente a libros de contenido religioso.\n• 5: Combatir con todas las fuerzas por la pureza y la castidad.\n• 6: Hacer diariamente examen de conciencia, meditación y lectura espiritual.\n• 7: Narrar cada día algún ejemplo edificante que ayude a la santificación de los demás."},{"num":41,"part":1,"q":"¿Cuándo ingresó Juan Bosco al seminario?","a":"El joven Juan Bosco ingresó al seminario a fines de octubre de 1835, después de haber meditado profundamente en lo que deseaba."},{"num":42,"part":1,"q":"Cuando Juan Bosco le pidió consejo a su madre para ser sacerdote o fraile, ella ¿qué le dijo?","a":"Cuando Juan Bosco le pidió consejo a su madre para hacerse sacerdote o fraile, ella le dijo: “Todos quieren intervenir en tu vocación pero yo no me meto, porque es Dios el que llama… Yo nací pobre, vivo pobre y moriré pobre, si te decides a ser sacerdote y llegas a ser rico, mi pie no pisará tu casa”."},{"num":43,"part":1,"q":"¿Qué trascendentales palabras dirigió Mamá Margarita a su hijo Juan el día de su toma de sotana?","a":"Le dijo con profunda emoción: «Hijo mío, has vestido la sotana eclesiástica y experimento el consuelo más grande de una madre... Pero recuerda que no es el hábito, sino la virtud lo que hace al sacerdote. Si alguna vez llegaras a dudar de tu vocación, ¡por caridad, no vayas a deshonrar esa sotana! Déjala cuanto antes. Prefiero verte como un pobre campesino antes que como un sacerdote infiel a sus deberes»."},{"num":44,"part":1,"q":"¿Quién fue Luis Comollo y cómo se manifestó su santa amistad con Juan Bosco?","a":"Fue un compañero de estudios y seminarista de virtudes extraordinarias, sobrino del párroco de Cinzano. Se conocieron en Chieri cuando Comollo soportó con paciencia sobrehumana las bofetadas de un compañero perverso. En el seminario fue para Juan su confidente y maestro de mansedumbre. Don Bosco escribió su biografía en 1844 presentándolo como dechado de santidad sacerdotal."},{"num":45,"part":1,"q":"¿Cómo se cumplió el pacto sobrenatural acordado entre Juan Bosco y Luis Comollo tras la muerte de este último?","a":"Ambos acordaron que quien muriera primero avisaría al sobreviviente sobre su salvación eterna. Comollo falleció el 2 de abril de 1839; en la noche del 3 al 4 de abril, a las 11:30 p.m., un estruendo sacudió el dormitorio del seminario y apareció una luz viva mientras una voz potente gritó por tres veces: «¡Bosco, me he salvado!», acontecimiento presenciado y atestiguado por los demás seminaristas."},{"num":46,"part":1,"q":"¿Qué servicios y distinciones académicas tuvo Juan Bosco durante sus seis años en el Seminario de Chieri?","a":"Gozó siempre del aprecio general de superiores y alumnos; ganó año tras año el premio semestral de sesenta francos otorgado al mejor expediente de estudio y conducta; fundó los círculos de discusión teológica y, en su segundo año de teología, fue nombrado sacristán mayor del seminario."},{"num":47,"part":1,"q":"¿Cómo se preparó Juan Bosco para recibir el Sacramento del Orden Sagrado en 1841?","a":"Hizo un riguroso retiro espiritual de diez días en la Casa de la Misión de San Vicente de Paúl en Turín, bajo la dirección del Padre Marco Antonio Durando, realizando una sincera confesión general de toda su vida y pidiendo a Dios la gracia del celo apostólico por las almas."},{"num":48,"part":1,"q":"¿Cuándo y dónde fue ordenado sacerdote Don Bosco?","a":"Don Bosco fue ordenado sacerdote el 5 de junio de 1841, en la Iglesia de María Inmaculada en Turín."},{"num":49,"part":1,"q":"¿Por quién fue ordenado sacerdote?","a":"Fue ordenado sacerdote por Monseñor Luis Fransoni, Arzobispo de Turín."},{"num":50,"part":1,"q":"¿Cuándo y dónde celebró su primera misa el Padre Juan Bosco?","a":"El Padre Juan Bosco celebró su primera misa al día siguiente de su ordenación, fiesta de la Santísima Trinidad, en la Iglesia de San Francisco de Asís en Turín."},{"num":51,"part":1,"q":"¿Qué pidió a Dios el Padre Juan Bosco el día de su primera misa?","a":"El día de su primera misa, el Padre Juan Bosco pidió a Dios el don de la Palabra. También pidió a Dios la Caridad, la Dulzura y la Humildad de San Francisco de Sales."},{"num":52,"part":1,"q":"¿Cuándo y dónde cantó su primera Misa Solemne el padre Juan Bosco?","a":"El Padre Juan Bosco cantó su primera Misa Solemne el día de Corpus Christi, el 10 de junio de 1841, en Castelnuovo, entre la alegría de su madre, sus hermanos y sus amigos."},{"num":53,"part":1,"q":"¿Dónde pasó Don Bosco los primeros meses de su sacerdocio?","a":"Los primeros meses de su sacerdocio los pasó Don Bosco en Castelnuovo, trabajando con el párroco de ese lugar."},{"num":54,"part":1,"q":"¿Qué conmovedor encuentro providencial vivió Don Bosco en Lavriano al auxiliar al anciano Juan Brina?","a":"Al acudir a confesar a un enfermo grave en Lavriano llamado Juan Brina, el anciano le refirió que en su juventud había dado asilo caritativo a una humilde familia de Castelnuovo apodada «los Boschetti». Don Bosco reconoció con lágrimas en los ojos que aquel hombre era quien había auxiliado a su propia familia en su mayor pobreza, exclamando: «¡El clérigo a quien usted ayudó es este sacerdote que ahora lo asiste; la Divina Providencia nos enseña que el que da, recibe!»."},{"num":55,"part":1,"q":"¿Qué era el «Convitto Eclesiástico» de Turín y qué formación proporcionó a Don Bosco entre 1841 y 1844?","a":"Era una escuela sacerdotal posdoctoral fundada por Don Luis Guala y orientada por San José Cafasso. Allí los jóvenes presbíteros profundizaban la teología moral de San Alfonso María de Ligorio y San Francisco de Sales superando el jansenismo rigorista, ejercitándose en la predicación y en la visita pastoral a cárceles y hospitales. Don Bosco escribió: «Allí se aprendía a ser sacerdote»."},{"num":56,"part":1,"q":"¿Cuáles fueron las principales actividades de Don Bosco en sus primeros meses de sacerdocio?","a":"Las principales actividades de Don Bosco en sus primeros meses de sacerdocio fueron: visitar semanalmente a los encarcelados y enfermos, principalmente a los que veía próximos a morir a causa de sus hábitos viciosos."},{"num":57,"part":1,"q":"¿Qué pensó y decidió Don Bosco mientras visitaba los presos en las cárceles de Turín, ya que algunos eran jóvenes?","a":"Mientras visitaba a los presos, de los cuales algunos eran jóvenes, Don Bosco pensó que todo eso podría prevenirse para que los jóvenes no estuvieran desorientados y decidió trabajar para los más pobres y abandonados en la Obra de los Oratorios Festivos."},{"num":58,"part":1,"q":"¿Por qué prohibió San José Cafasso a Don Bosco partir como misionero a tierras extranjeras?","a":"Don Bosco sentía un vivo anhelo de ingresar al noviciado de los Oblatos de la Virgen para partir a misiones foráneas. San José Cafasso, examinando en la oración sus achaques bronquiales y las apremiantes urgencias del pueblo piamontés, le dijo tajantemente: «Dios no lo quiere allá; su campo de misión son los jóvenes pobres y abandonados de Turín»."},{"num":59,"part":1,"q":"¿Cómo se desarrolló el discernimiento vocacional final de Don Bosco al salir del Convitto en octubre de 1844?","a":"Don Cafasso le propuso tres destinos: vicario en Buttigliera, repetidor de moral en el Convitto o director del Hospitalito de Santa Filomena en el Refugio Barolo. Don Bosco se puso en absoluta disponibilidad: «Mi propensión es entregarme a los jóvenes; me parece encontrarme ante una multitud inmensa de muchachos que me piden auxilio». Cafasso lo envió al Refugio, donde precisamente se abriría la puerta hacia Valdocco."},{"num":60,"part":1,"q":"¿Todavía existen parientes de San Juan Bosco?","a":"Sí, todavía existen parientes de San Juan Bosco, entre ellos ALDO y LAURA, tataranietos de su hermano Antonio, y JUAN, tataranieto de su hermano José y quien tiene un hijo que se llama FRANCISCO y nació en 1972."},{"num":61,"part":1,"q":"¿Qué drástica medida tomó Mamá Margarita durante la hambruna de 1817 para salvar a su familia cuando se agotó el alimento y el vecino Bernardo Cavallo regresó sin víveres?","a":"Tras ponerse de rodillas y rezar recordando la recomendación de su difunto esposo de confiar en Dios, Margarita exclamó que ante casos extremos se requerían soluciones extremas; se dirigió de inmediato al establo acompañada del señor Cavallo, sacrificó un ternero de la familia e hizo cocinar a toda prisa una parte para saciar el hambre desesperada de sus hijos y de su anciana suegra."},{"num":62,"part":1,"q":"¿Qué profunda advertencia le hizo la abuela paterna de Juanito Bosco tras escuchar el relato del Sueño de los 9 años?","a":"Aunque era completamente analfabeta, la abuela sentenció con gran sabiduría y prudencia campesina: «No hay que hacer caso a los sueños», criterio de reserva que el propio Juanito compartió inicialmente y mantuvo durante años antes de comprender la revelación divina de su vocación."},{"num":63,"part":1,"q":"¿Qué significado sociocultural y penal tenía el pecado de la «blasfemia» que tanto enfurecía a Juanito en su sueño y en sus primeros juegos?","a":"En las tradiciones domésticas y la legislación del antiguo Reino Sabaudo y la Restauración, la blasfemia contra Dios era considerada una profanación gravísima que llegó a castigarse penalmente con prisión o galeras; para Juan simbolizaba la máxima fealdad del pecado y la degradación moral de la juventud abandonada, a la cual debía rescatar «no con golpes, sino con la mansedumbre y la caridad»."},{"num":64,"part":1,"q":"¿Qué hecho providencial impulsó a Don Bosco a redactar por escrito sus Memorias del Oratorio y el Sueño de los 9 años?","a":"Fue un mandato explícito y formal del Papa Pío IX durante la audiencia que le concedió en Roma en 1858 para los asuntos de la congregación; el pontífice le ordenó poner por escrito de manera literal y detallada todo hecho de carácter sobrenatural como herencia y estímulo perpetuo para la Familia Salesiana."},{"num":65,"part":1,"q":"¿Por qué Juanito Bosco renunció definitivamente al violín tras la fiesta patronal de San Bartolomé en Crivelle?","a":"Porque tras tocar con entusiasmo en la función religiosa y en el banquete familiar, observó que los invitados comenzaron a bailar desordenadamente al compás de su música; consternado por haber promovido lo que él siempre criticaba en público, rompió el violín en pedazos y jamás volvió a tocarlo en su vida."},{"num":66,"part":1,"q":"¿Qué incidente dramático provocó que el seminarista Juan Bosco renunciara de por vida a la cacería?","a":"Tras perseguir durante horas a una liebre y matarla de un certero disparo en un viñedo, sus amigos llegaron corriendo a felicitarlo; al verse a dos millas de su casa, sin sotana, en mangas de camisa y con sombrero de paja como un peón rústico, sintió un profundo remordimiento de haber dado escándalo contra la compostura clerical, pidió disculpas a sus compañeros y prometió no volver a empuñar un arma de caza."},{"num":67,"part":1,"q":"¿Qué asombroso suceso de ultratumba vivieron los seminaristas de Chieri tras la muerte de Luis Comollo el 2 de abril de 1839?","a":"Cerca de las 11:30 de la noche, se escuchó un estruendo aterrador por los corredores del seminario, semejante a una descomunal carreta tirada por caballos que hizo temblar el dormitorio de veinte seminaristas; en medio del pánico general, se oyó con total claridad la voz potente de Comollo repitiendo tres veces: «¡Bosco, me he salvado!», cumpliendo así el imprudente pacto que habían hecho en vida."},{"num":68,"part":1,"q":"¿Qué estremecedora advertencia le dio Mamá Margarita a su hijo Juan a solas la noche de su Primera Misa en Castelnuovo?","a":"Le dijo con solemnidad maternal: «Juan, ya eres sacerdote, ya puedes celebrar la misa. De hoy en adelante estarás más cerca de Jesucristo, pero recuerda que empezar a decir Misa es empezar a sufrir. De hoy en adelante piensa, no en tu madre, sino en la salvación de las almas. Si algún día llegaras a ser rico, jamás volveré a poner los pies en tu casa»."},{"num":69,"part":1,"q":"¿Cómo demostró la Divina Providencia a Don Bosco la máxima evangélica de que «el que da, recibe» tras la caída de su caballo en el valle de Casalborgone?","a":"Tras quedar inconsciente en una pila de piedras por el desboque de su caballo rumbo a Lavriano, fue auxiliado por el campesino Juan Calosso, apodado «Brina»; mientras lo curaban, Brina le relató que años atrás un seminarista y su familia en Los Becchi lo habían rescatado a medianoche de un pantano sin cobrarle nada; Don Bosco, conmovido hasta el llanto, le reveló que él era aquel mismo clérigo que ahora recibía su caridad multiplicada."},{"num":70,"part":2,"q":"¿Qué son los Oratorios Festivos?","a":"Los Oratorios Festivos de Don Bosco son centros de reunión para los jóvenes en donde se practica el deporte, pero sobre todo se aprende a conocer y amar a Dios, en un clima de amistad y alegría, con espíritu de familia."},{"num":71,"part":2,"q":"¿Con qué joven inició Don Bosco sus Oratorios Festivos y cuándo lo encontró?","a":"Don Bosco inició sus Oratorios Festivos con un joven llamado Bartolomé Garelli y lo encontró cuando iba a celebrar misa el 8 de Diciembre de 1841."},{"num":72,"part":2,"q":"¿Cuáles fueron los detalles del célebre encuentro entre Don Bosco y Bartolomé Garelli en la sacristía de San Francisco de Asís?","a":"El sacristán Comotti golpeó con un leño a Garelli por no saber ayudar al altar. Don Bosco intervino defendiéndolo: «¿Por qué le pega? Es amigo mío». Tras la misa lo condujo al coro, constató que era huérfano de 16 años, analfabeto y albañil de Asti; al admitir que no sabía cantar, Don Bosco le preguntó si sabía silbar, le enseñó a persignarse y rezaron juntos un Ave María, piedra angular de toda la congregación salesiana."},{"num":73,"part":2,"q":"¿Qué procedencia y condición social tenían los primeros jóvenes que integraron el Oratorio en el Convitto?","a":"Eran muchachos provincianos e inmigrantes que trabajaban como picapedreros, albañiles, yeseros y deshollinadores, procedentes de Saboya, Lombardía y Biella (como José Buzzetti y sus hermanos). Al no conocer parroquias ni tener familiares en Turín, vivían expuestos al abandono moral y laboral."},{"num":74,"part":2,"q":"De entre los alumnos de Don Bosco, ¿quiénes son los dos más famosos?","a":"De entre los alumnos de Don Bosco, los dos más famosos fueron: DOMINGO SAVIO, que murió a los 15 años de edad y que ha sido declarado santo. Y MIGUEL RÚA, que se hizo sacerdote y llegó a ser el primer sucesor de Don Bosco y ya está cerca de ser declarado santo [beatificado]."},{"num":75,"part":2,"q":"¿Cómo fue el primer encuentro profético de Don Bosco con Miguel Rúa en 1845?","a":"En Porta Palazzo, Don Bosco distribuía medallas a los niños. Al acercarse Miguelito Rúa, de ocho años, Don Bosco no le dio una medalla, sino que le extendió su mano izquierda abierta y con la derecha hizo el ademán de cortarla a la mitad diciendo: «¡Toma, Miguelito, toma! Nosotros dos iremos siempre a medias en todo», anunciando su futura colaboración y sucesión."},{"num":76,"part":2,"q":"¿En qué fecha y bajo qué circunstancias se utilizó por primera vez el nombre histórico de «Salesianos»?","a":"En la noche del 26 de enero de 1854, en la habitación de Don Bosco, este propuso a los jóvenes clérigos Miguel Rúa, Juan Cagliero, Santiago Artiglia y José Rocchietti realizar un ejercicio práctico de caridad hacia el prójimo bajo la protección de San Francisco de Sales, acordando llamarse desde entonces «Salesianos»."},{"num":77,"part":2,"q":"¿Don Bosco estableció su obra desde un principio en Valdocco, Turín?","a":"No. Don Bosco no estableció su obra desde un principio en Valdocco, Turín. Antes anduvo de un lado a otro porque mucha gente no lo comprendía, unos lo juzgaban loco, otros se burlaban de él por andar jugando con los niños y hasta muchos amigos se alejaron de él."},{"num":78,"part":2,"q":"¿Cuáles fueron las etapas del difícil peregrinar del «Oratorio Ambulante» entre 1844 y 1846?","a":"El Oratorio recorrió sucesivamente los siguientes lugares:\n• 1) El Refugio de la Marquesa de Barolo (Capilla de San Francisco de Sales).\n• 2) La capilla de San Martín en los Molinos Dora.\n• 3) El cementerio de San Pedro in Vincoli.\n• 4) Tres habitaciones en la Casa del sacerdote José Moretta.\n• 5) El prado a campo abierto de los hermanos Filippi."},{"num":79,"part":2,"q":"¿Qué mensaje consolador transmitió el teólogo Juan Borel a los jóvenes en su célebre «sermón de las coles»?","a":"Ante el desconsuelo de los muchachos por ser expulsados de un lugar tras otro, Don Borel les explicó con lenguaje gráfico que los oratorianos eran como las sabrosas coles de Turín: solo crecen grandes, lozanas y con repollos compactos cuando son trasplantadas varias veces de huerto en huerto, demostrando que las persecuciones fortalecían la obra de Dios."},{"num":80,"part":2,"q":"¿Cómo frustró Don Bosco el intento de internarlo en el manicomio de Turín por parte de sacerdotes bienintencionados?","a":"Convencidos de que Don Bosco desvariaba al prometer casas, talleres e iglesias monumentales para miles de jóvenes, los teólogos Ponsatti y Carpano dispusieron una carroza para conducirlo al manicomio de Collegno. Don Bosco, enterado de la estratagema, los invitó con reverencia a subir primero; acto seguido cerró de golpe la portezuela y gritó al cochero: «¡Rápido al manicomio, que estos señores tienen prisa!», quedando ellos recluidos provisionalmente."},{"num":81,"part":2,"q":"¿Cómo se produjo el providencial encuentro con Pancrasio Soave el 5 de abril de 1846?","a":"Habiendo vencido el plazo para abandonar el prado Filippi, Don Bosco se retiró a un rincón a orar y llorar angustiado pidiendo un techo para sus muchachos. De pronto se le acercó el tartamudo Pancrasio Soave diciéndole que un tal Francisco Pinardi alquilaba un cobertizo en la barriada de Valdocco, sellando el contrato de arrendamiento ese mismo día."},{"num":82,"part":2,"q":"¿En qué condiciones materiales se encontraba el Cobertizo Pinardi y cuándo se inauguró oficialmente?","a":"Era un cobertizo de tejas carcomidas, piso de tierra y una altura de apenas un metro en su parte trasera. Se cavó medio metro el suelo, se entarimó y se colocaron vigas maestras. Se inauguró solemnemente el 12 de abril de 1846, Domingo de Pascua de Resurrección, como la primera capilla y casa estable del Oratorio de San Francisco de Sales."},{"num":83,"part":2,"q":"¿Qué admirable milagro salvó la vida de Don Bosco durante su grave enfermedad pulmonar en julio de 1846?","a":"Agotado por el exceso de trabajo, sufrió una neumonía con hemoptisis que lo puso a las puertas de la muerte. Sus muchachos oratorianos hicieron ayunos, caminaron descalzos y pasaron noches enteras en oración ante la Virgen de la Consolata. Don Bosco sanó milagrosamente y, al reintegrarse, les dijo conmovido: «A ustedes les debo la vida... tengan por seguro que en adelante cada respiración mía será consagrada enteramente para ustedes»."},{"num":84,"part":2,"q":"¿Cómo hacía Don Bosco para sostener su obra?","a":"Para sostener su obra Don Bosco recibía donativos de toda clase de gente y procuraba el apoyo de las autoridades: del Papa, del Rey, del Arzobispo y demás autoridades eclesiásticas y civiles."},{"num":85,"part":2,"q":"¿De quién recibió Don Bosco el apoyo más decidido en el trabajo del Oratorio?","a":"En el trabajo del Oratorio, Don Bosco recibió el apoyo más decidido de su propia madre: MAMÁ MARGARITA, que dejando su propia casa se fue a vivir con él."},{"num":86,"part":2,"q":"¿Cómo fue el traslado a pie de Mamá Margarita y Don Bosco a Valdocco el 3 de noviembre de 1846?","a":"Salieron caminando juntos desde I\u0027 Becchi recorriendo cerca de treinta kilómetros. Margarita llevaba un canasto con ropa blanca y algunos víveres, mientras Don Bosco cargaba su breviario, misal y apuntes. Esa pobreza evangélica fue todo su capital para levantar el primer hogar para la juventud abandonada de Turín."},{"num":87,"part":2,"q":"¿Cómo nació el primer internado u «Hospicio» de Valdocco en mayo de 1847?","a":"Una noche lluviosa llamó a la puerta un muchachito huérfano de Biella completamente empapado y tiritando de frío que buscaba albergue. Mamá Margarita lo recibió, le secó las ropas en el fogón, le sirvió sopa caliente y le acondicionó una cama improvisada con paja y sábanas limpias en la cocina, naciendo así el internado permanente de Valdocco."},{"num":88,"part":2,"q":"¿Hasta cuándo acompañó Mamá Margarita a Don Bosco en el trabajo del Oratorio?","a":"Mamá Margarita acompañó a Don Bosco en el trabajo del Oratorio hasta que Dios la llamó el 25 de Noviembre de 1856. En su nombre se dedica ese día para rezar por los papás difuntos de todos los salesianos y miembros de la Familia Salesiana."},{"num":89,"part":2,"q":"¿Cuándo se reunían los jóvenes con Don Bosco?","a":"Los jóvenes se reunían con Don Bosco primero sólo los domingos, luego se fueron quedando con él los más necesitados y los que no tenían hogar."},{"num":90,"part":2,"q":"¿Qué aporte pedagógico y social representaron las Escuelas Nocturnas del Oratorio de Valdocco?","a":"Fueron pioneras en el Piamonte para la alfabetización y capacitación técnica de jóvenes obreros que no podían asistir a la escuela de día. Incluían lectura, cálculo, caligrafía, dibujo industrial y contabilidad. La Administración Municipal de Turín y la Pía Obra de la Mendicidad Instruida inspeccionaron las aulas, premiando y subvencionando la obra por su indiscutible utilidad pública."},{"num":91,"part":2,"q":"¿Cuáles fueron los textos escolares redactados por Don Bosco para la educación popular de sus jóvenes?","a":"Al no encontrar obras adecuadas a la mentalidad popular y juvenil, escribió y publicó:\n• «El Joven Instruido» (1847), manual ascético y devocionario que alcanzó más de cien ediciones.\n• «Historia Sagrada para uso de las escuelas» (1847), redactada en lenguaje sencillo y ameno.\n• «El Sistema Métrico Decimal reducido a nociones elementales» (1849), para instruir a los artesanos."},{"num":92,"part":2,"q":"¿Qué finalidad tenía la Compañía de San Luis Gonzaga fundada en el Oratorio en 1847?","a":"Era una asociación de alumnos distinguidos por su conducta y devoción que asumía el compromiso de ser modelo en el patio y en la iglesia, frecuentar la Confesión y Comunión, cuidar el lenguaje y brindar apoyo mutuo, constituyendo el motor formativo del ambiente oratoriano."},{"num":93,"part":2,"q":"¿Por qué Don Bosco redactó los primeros contratos formales de aprendizaje laboral en 1851-1852?","a":"Para defender a los jóvenes aprendices de la explotación laboral, maltrato físico y abusos de los patronos en los talleres de la ciudad. Don Bosco exigió por contrato escrito salario justo, descanso dominical, respeto a la moral cristiana y obligación patronal de enseñar verdaderamente el oficio sin usar la violencia."},{"num":94,"part":2,"q":"¿Cómo se cumplió la profecía de Gabriel Fassio y la protección del Oratorio en la explosión del polvorín de 1852?","a":"En 1851 el joven artesano Gabriel Fassio anunció en su agonía un gran desastre para Turín el 26 de abril de 1852, pidiendo invocar a San Luis. El 26 de abril estalló el polvorín militar cerca de San Pedro in Vincoli causando ruina en los alrededores; sin embargo, en Valdocco no hubo víctimas humanas ni derrumbes personales graves."},{"num":95,"part":2,"q":"¿Quién fue el misterioso perro «Gris» (Il Grigio) y qué prodigios realizó en auxilio de Don Bosco?","a":"Fue un perro corpulento y solitario de color grisáceo que apareció en momentos en que Don Bosco era emboscado, apaleado o tiroteado en callejones peligrosos de Turín entre 1852 y 1860. El animal derribaba a los asaltantes, protegía a Don Bosco hasta la puerta del Oratorio y desaparecía misteriosamente sin comer ni pertenecer a ningún vecino."},{"num":96,"part":2,"q":"¿Cómo financió Don Bosco la construcción de la Iglesia de San Francisco de Sales en Valdocco (1851-1852)?","a":"Organizó en 1851-1852 una monumental lotería de caridad con más de 3,200 premios donados por el Papa Pío IX, la Casa Real de Saboya y benefactores. Se vendieron más de 74,000 billetes, obteniendo los fondos indispensables para inaugurar el primer templo salesiano el 20 de junio de 1852."},{"num":97,"part":2,"q":"¿Quién es la Virgen Auxiliadora de los cristianos?","a":"LA VIRGEN AUXILIADORA DE LOS CRISTIANOS, es la Madre de Dios, en quien Don Bosco puso su fe para proteger su obra."},{"num":98,"part":2,"q":"¿Cómo demostró Don Bosco su devoción a la Virgen?","a":"Don Bosco demostró su devoción a la Virgen haciendo construir una Basílica dedicada a María Auxiliadora en Turín, que fue terminada en 1868, y consagrándole su vida entera y todas su obras."},{"num":99,"part":2,"q":"¿Qué pensaba Don Bosco al mismo tiempo que se dedicaba a los jóvenes?","a":"Don Bosco al mismo tiempo que se dedicaba a los jóvenes, pensaba que era necesario buscar quien le ayudara a trabajar con ellos, así empezó a organizar un grupo de colaboradores, los que luego llegaron a llamarse SALESIANOS."},{"num":100,"part":2,"q":"¿Cuándo fundó Don Bosco la Congregación Salesiana?","a":"Don Bosco fundó la Congregación Salesiana en 1859, guiado siempre por su gran Maestra María Auxiliadora."},{"num":101,"part":2,"q":"¿Por qué Don Bosco llamó salesiana a su congregación?","a":"Don Bosco llamó Salesiana a su congregación porque quiso que los salesianos imitasen a San Francisco de Sales en su dulzura y amabilidad."},{"num":102,"part":2,"q":"¿A qué se dedicaba la Congregación o sociedad Salesiana?","a":"La Congregación o Sociedad Salesiana se dedica a la Educación y Formación Cristiana de los jóvenes, principalmente de los más pobres y abandonados."},{"num":103,"part":2,"q":"¿Todos los miembros de la Congregación son sacerdotes?","a":"No todos son sacerdotes, hay también un buen número de Salesianos que sin ser sacerdotes son igualmente religiosos y reciben el nombre de COADJUTORES."},{"num":104,"part":2,"q":"¿Cuál es la clave del éxito de Don Bosco y los Salesianos?","a":"La clave del éxito de Don Bosco y de los Salesianos en el Espíritu de familia que vive en todas su Comunidades."},{"num":105,"part":2,"q":"¿La vida Religiosa Salesiana es sólo para varones?","a":"No, la Vida Religiosa Salesiana no es sólo para varones, pues en 1872 Don Bosco fundó también el Instituto de las Hijas de María Auxiliadora, que se llama también de las salesianas, y se dedican a trabajar entre las jóvenes pobres y abandonadas."},{"num":106,"part":2,"q":"¿Quién fue la fundadora con Don Bosco de las Salesianas?","a":"La cofundadora de las Salesianas con Don Bosco fue STA. MARIA DOMINGA MAZZARELLO."},{"num":107,"part":2,"q":"¿Cuáles son las principales actividades de los Salesianos y Salesianas?","a":"Las principales actividades de los Salesianos y Salesiana son: Los Oratorios Festivos, Los colegios, Escuelas de arte y oficios, Academias comerciales y secretariales, Escuelas profesionales gráficas y talleres, Parroquias y templos, Catequesis y evangelización, Centros Juveniles, Misiones en el país y en el extranjero."},{"num":108,"part":2,"q":"¿Quiénes dice Don Bosco que son los Cooperadores Salesianos?","a":"Don Bosco nos dice que los COOPERADORES SALESIANOS son seglares que colaboran en la Iglesia de Cristo, Obispos y sacerdotes varios, que viven y apoyan el espíritu y la misión que Dios legó a Don Bosco."},{"num":109,"part":2,"q":"¿Cuáles fueron los mensajes que Don Bosco dejó antes de morir?","a":"Los mensajes que Don Bosco dejó antes de morir fueron: a los Salesianos “ámense, ámense, ámense en el Señor”, “trabajo, trabajo, trabajo”. Y para los alumnos “Frecuente Comunión y entrañable amor a María Auxiliadora” “ofrenda de trabajo”."},{"num":110,"part":2,"q":"¿Cuándo fue la muerte de Don Bosco?","a":"La muerte de Don Bosco fue el 31 de enero de 1888 exclamando “Digan a los jóvenes que los espero a todos en el paraíso”."},{"num":111,"part":2,"q":"¿Qué significado tuvo la colección mensual de las «Lecturas Católicas» fundada por Don Bosco en 1853?","a":"Fue un poderoso apostolado de prensa popular fundado con el aval de Mons. Luis Moreno para llevar instrucción cristiana sólida a los hogares campesinos y obreros frente al proselitismo protestante y liberal, publicando vidas de santos, historia sacra y apologética a bajo precio."},{"num":112,"part":2,"q":"¿Qué acontecimiento providencial ocurrió la noche del derrumbe en Valdocco el 2 de diciembre de 1852?","a":"A la medianoche se derrumbó la construcción nueva a causa de lluvias incesantes. Dos horas antes, trescientos alumnos de la escuela nocturna estaban congregados al pie del muro; la viga maestra quedó suspendida milagrosamente en el aire sobre el dormitorio donde dormían Don Bosco y treinta niños, sin registrarse heridos."},{"num":113,"part":2,"q":"¿Quién fue Don Juan Borel en la historia fundacional del Oratorio?","a":"Fue capellán de la corte real de Turín y el colaborador más cercano, generoso e incansable de Don Bosco. Donó sus bienes personales a los muchachos pobres, compartió el calvario del oratorio ambulante y personificó el principio salesiano: «Hacerse todo para todos»."},{"num":114,"part":2,"q":"¿Quién fue José Buzzetti y por qué representa el modelo del Salesiano Coadjutor?","a":"Fue uno de los primeros jóvenes albañiles acogidos por Don Bosco en 1841. Tras perder los dedos de la mano derecha al desviar un balazo dirigido a Don Bosco, renunció al sacerdocio para consagrarse de por vida como Salesiano Coadjutor, dirigiendo los talleres y administrando la casa de Valdocco con fidelidad heroica."},{"num":115,"part":2,"q":"¿En qué rasgos del apostolado de San Felipe Neri se inspiró San Juan Bosco para sus oratorios?","a":"En su entrega total a los muchachos callejeros, la pedagogía del buen humor y la alegría, los cantos sagrados, las excursiones campestres y la capacidad de ganarse el corazón juvenil a través de la amabilidad evangélica."},{"num":116,"part":2,"q":"¿Cómo sorteó Don Bosco las tormentas políticas de las revoluciones de 1848-1849 en Turín?","a":"Rechazó que sus oratorios fueran utilizados para mítines o propaganda de partidos y curas revolucionarios, afirmando categóricamente: «Mi política es la política del Padrenuestro», logrando con la ayuda del Arzobispo Fransoni formar a los jóvenes como buenos cristianos y honrados ciudadanos."},{"num":117,"part":2,"q":"¿Qué suceso histórico ocurrió en la noche del 18 de diciembre de 1859 en Valdocco?","a":"Reunidos dieciocho clérigos y sacerdotes en la habitación de Don Bosco, se eligió el primer Consejo General de la Sociedad de San Francisco de Sales, nombrando a Don Bosco Superior General y a Don Miguel Rúa como primer prefecto, quedando formalmente fundada la Congregación."},{"num":118,"part":2,"q":"¿Cuáles fueron las tres grandes lumbreras del clero turinés que formaron sacerdotalmente a Don Bosco en el Convitto Eclesiástico?","a":"El teólogo Luis Guala (fundador de la residencia), San José Cafasso (maestro de teología moral y director espiritual) y el Padre Félix Golzio (modelo de humildad y laboriosidad incansable), quienes extirparon los últimos vestigios de rigorismo jansenista e inculcaron la pastoral alfonsiana de misericordia."},{"num":119,"part":2,"q":"¿Qué terrible realidad descubrió Don Bosco al visitar con San José Cafasso las cárceles de Turín (como la Senatorial, la Correccional y las Torres de Porta Palatina)?","a":"Vio con horror a multitud de muchachos de 12 a 18 años, sanos, robustos e inteligentes, ociosos y roídos por insectos, degradados humana y espiritualmente; y constató con dolor que tras salir de prisión con buenos propósitos, reincidían casi fatalmente por carecer de un guía bondadoso que les diera oficio y protección los días festivos."},{"num":120,"part":2,"q":"¿Cuál fue el itinerario completo de traslados que sufrió el «Oratorio Ambulante» entre 1844 y 1846 antes de llegar a Valdocco?","a":"Peregrinó por seis lugares sucesivos:\n• El Refugio de la Marquesa de Barolo (habitaciones y capilla contigua al Hospitalito).\n• El Cementerio y capilla funeraria de San Pedro in Vincoli.\n• La capilla de San Martín en los Molinos Dora (Porta Palazzo).\n• Tres habitaciones alquiladas en la Casa del sacerdote José Moretta.\n• El campo abierto y potrero de los hermanos Filippi.\n• El cobertizo y terreno de Francisco Pinardi en Valdocco (Pascua de 1846)."},{"num":121,"part":2,"q":"¿Qué trágico desenlace sufrieron el capellán José Tessio y su sirvienta tras expulsar violentamente al Oratorio de San Pedro in Vincoli?","a":"Tras redactar con cólera una carta al Municipio exigiendo la orden de aprehensión contra Don Bosco y sus muchachos, el capellán P. Tessio sufrió un ataque apoplético fulminante pocas horas después de firmarla; su criada Margarita Sussolino corrió la misma suerte misteriosa dos días más tarde, conmocionando a todo el vecindario turinés."},{"num":122,"part":2,"q":"¿Por qué el secretario municipal Cussetti redactó una carta expulsando al Oratorio de los Molinos Dora y qué le aconteció posteriormente?","a":"Recogió quejas exageradas de comerciantes afirmando falsamente que los muchachos dañaban la propiedad y causaban inmoralidad; tras redactar la orden de desalojo, Cussetti comenzó a padecer un violento temblor en su mano derecha que le impidió volver a escribir hasta morir tres años después, y providencialmente su hijo huérfano terminó pidiendo techo y pan en el Hospicio de Don Bosco en Valdocco."},{"num":123,"part":2,"q":"¿Qué conmovedora respuesta le dio Don Bosco a la Marquesa de Barolo cuando ella le exigió elegir entre su obra caritativa o los muchachos callejeros?","a":"Don Bosco le respondió con serenidad inquebrantable: «Usted tiene dinero y puede encontrar fácilmente cuantos sacerdotes desee para sus obras; mis pobres muchachos no tienen a nadie en el mundo fuera de mí, por tanto prefiero renunciar a mi empleo y salario antes que abandonar a los jóvenes»."},{"num":124,"part":2,"q":"¿Cómo libró Don Bosco la trampa de los dos sacerdotes (Vicente Ponsati y Jacinto Carpano) que pretendían encerrarlo en el manicomio creyéndolo demente?","a":"Los recibió con amable cortesía en su habitación; cuando lo invitaron a subir a un carruaje con el pretexto de dar un paseo para cuidar su salud, Don Bosco insistió con exquisita reverencia sacerdotal en que ellos subieran primero («primero las visitas»); en cuanto ambos abordaron, Don Bosco cerró de golpe la portezuela y le gritó al cochero: «¡Al manicomio a toda prisa, que los esperan!»."},{"num":125,"part":2,"q":"¿Cómo se pactó de forma inesperada el contrato del cobertizo Pinardi el 5 de abril de 1846?","a":"Mientras Don Bosco lloraba a solas pidiendo a Dios un lugar para sus jóvenes, apareció el tartamudo Pancracio Soave ofreciéndole el caidizo trasero de Francisco Pinardi; Don Bosco aceptó pagar 320 liras anuales a condición de que cavaran el suelo medio metro para que no golpeara el techo con la cabeza y le incluyeran el patio para recreos."},{"num":126,"part":2,"q":"¿Qué sacrificios heroicos realizaron los muchachos albañiles y jóvenes del Oratorio durante la mortal enfermedad de Don Bosco en julio de 1846?","a":"Desahuciado Don Bosco por neumonía y hemoptisis, los jóvenes se turnaron día y noche orando descalzos ante la Virgen Consolata; muchos albañiles ayunaron a pan y agua semanas enteras sin suspender sus duras jornadas de trabajo, y ofrecieron a Dios sus propias vidas con tal de que el Señor salvara a su padre espiritual."},{"num":127,"part":2,"q":"¿Qué bienes personales vendió y transformó Mamá Margarita el 3 de noviembre de 1846 al instalarse con Don Bosco en Valdocco?","a":"Sacrificó la tranquilidad de su aldea y su ajuar matrimonial intacto: con sus vestidos de novia y sábanas confeccionó manteles, albas y casullas para la capilla; y vendió su collar y anillo de oro para adquirir galones y brocados sagrados, cantando con humor: «¡Ay del mundo si nos viera forasteros y sin nada!»."},{"num":128,"part":2,"q":"¿Cuál fue el origen de las famosas «Buenas Noches» en la pedagogía salesiana?","a":"Surgieron en 1847 en el recién fundado Hospicio de Valdocco, cuando los primeros muchachos internos debían salir a trabajar de aprendices en talleres de la ciudad y regresaban expuestos a conversaciones corruptas e ideas antirreligiosas; Don Bosco comenzó a reunirles brevemente antes de dormir para darles una palabra paternal que neutralizara los malos ejemplos del día."},{"num":129,"part":2,"q":"¿Cómo defendió Don Bosco la neutralidad del Oratorio frente a los halagos del Marqués Roberto d’Azeglio durante la efervescencia política de 1848?","a":"D’Azeglio le propuso sumarse a las manifestaciones liberales y vestir a sus muchachos con escarapelas a cambio de cuantiosos subsidios del Estado; Don Bosco rehusó tajantemente afirmando: «Mi política es la del Padre Nuestro; mi única misión es hacer buenos cristianos y honrados ciudadanos, y me mantendré siempre al margen de las facciones partidistas»."},{"num":130,"part":2,"q":"¿Qué doloroso cisma protagonizaron los «curas patriotas» en el Oratorio en 1848?","a":"Varios sacerdotes colaboradores entraron ostentando periódicos políticos y banderas revolucionarias, destruyeron periódicos católicos y predicaron en la capilla discursos incendiarios de emancipación; salieron en desfile arrastrando a los muchachos hacia el monte de los Capuchinos, dejando a Don Bosco en la más absoluta soledad pastoral durante meses."},{"num":131,"part":2,"q":"¿Qué ilustres sacerdotes acudieron providencialmente a visitar a Don Bosco y terminaron impartiendo catecismo en su oratorio abandonado?","a":"El venerable P. Antonio Rosmini (célebre filósofo y fundador del Instituto de la Caridad) y el canónigo Pedro de Gaudenzi (futuro obispo de Vigevano), a quienes Don Bosco inmediatamente puso al frente de los grupos más inquietos para confesar y catequizar."},{"num":132,"part":2,"q":"¿Cómo consiguió Don Bosco los 30,000 francos para comprar la Casa Pinardi en solo quince días en 1850?","a":"Tras pactar la compra con Pinardi bajo una cláusula penal de 100,000 francos, esa misma noche San José Cafasso le llevó una donación anónima de 10,000 francos de la condesa Casazza-Riccardi; al día siguiente un sacerdote rosminiano le prestó 20,000 francos que deseaba invertir a rédito, y el banquero José Antonio Cotta cubrió los 3,000 francos de gastos notariales."},{"num":133,"part":2,"q":"¿Por qué Don Bosco se vio obligado a adquirir la taberna «La Jardinera» (Casa Bellezza) contigua a Pinardi?","a":"Porque era un foco suburbano de borracheras, juergas y escándalos inmorales que perturbaba las actividades dominicales y ponía en peligro la inocencia de los muchachos; Don Bosco arrendó todo el local, compró su mobiliario y la clausuró definitivamente como centro de vicio."},{"num":134,"part":2,"q":"¿Qué milagrosa circunstancia rodeó el derrumbe de la nueva construcción del Oratorio la medianoche del 2 de diciembre de 1852?","a":"Tras torrenciales lluvias otoñales, los muros nuevos y el pesado tejado colapsaron con estruendo sobre el antiguo edificio; milagrosamente una viga gigante quedó suspendida en el aire sobre el dormitorio de Don Bosco y 30 jóvenes sin caer, y si el desastre hubiese ocurrido dos horas antes habría sepultado a 300 alumnos de las escuelas nocturnas que conversaban bajo la obra."},{"num":135,"part":2,"q":"¿Qué heroica acción ciudadana realizó el sargento Pablo Sacchi durante la explosión del polvorín de Turín el 26 de abril de 1852?","a":"Cuando estalló el polvorín cercano a San Pedro in Vincoli causando 28 muertes y afectando severamente a la ciudad, el sargento Sacchi expuso temerariamente su vida arrojándose entre las llamas para impedir que el fuego alcanzara la reserva central de dinamita, salvando a Turín de una destrucción catastrófica."},{"num":136,"part":2,"q":"¿Qué profecía hizo el joven artesano Gabriel Fassio un año antes sobre la catástrofe del polvorín de Turín?","a":"En estado de delirio por una grave enfermedad en 1851, Fassio gritaba repetidamente: «¡Ay de Turín el 26 de abril! Rezar a San Luis para que proteja el Oratorio»; Don Bosco instituyó desde entonces un Padre Nuestro, Ave María y Gloria diario a San Luis, y el 26 de abril de 1852 el polvorín estalló sin que ningún habitante de Valdocco sufriera daño alguno."},{"num":137,"part":2,"q":"¿Qué atentados brutales sufrió Don Bosco a raíz de la publicación de las «Lecturas Católicas» en 1853-1854?","a":"Sufrió múltiples agresiones criminales:\n• Un disparo de fusil atravesó la ventana del Oratorio mientras daba catequesis, perforando su sotana entre el brazo y las costillas.\n• Un sujeto armado con un enorme cuchillo lo persiguió por el patio intentando asesinarlo en pleno día.\n• En la casa Sardi intentaron apalearlo apagando las luces bajo el engaño de confesar a una enferma falsa, librándose al cubrirse la cabeza con una silla (donde perdió media falange de un dedo)."},{"num":138,"part":2,"q":"¿Cuáles fueron las providenciales apariciones del legendario perro «Gris» para salvar la vida de Don Bosco?","a":"Aparecía sorpresivamente en noches oscuras en los descampados de Valdocco para custodiar a Don Bosco frente a emboscadas; en una ocasión derribó a dos asaltantes que intentaban amordazarlo con un saco; en el Oratorio se dejó acariciar por Mamá Margarita y los jóvenes sin probar alimento terrenal, y su última aparición documentada ocurrió en 1866 en el camino solitario a Moncucco."},{"num":139,"part":2,"q":"¿Cuál fue la profecía de Don Bosco sobre la epidemia del Cólera Morbo en Turín en 1854 y la promesa hecha a sus jóvenes voluntarios?","a":"Mientras el cólera causaba miles de muertos en la ciudad, Don Bosco reunió a sus jóvenes y les prometió solemnemente que si se mantenían en gracia de Dios, llevaban al cuello una medalla de la Virgen y auxiliaban a los apestados, ninguno de ellos sería contagiado; 44 oratorianos sirvieron heroicamente como enfermeros y ninguno contrajo la enfermedad."},{"num":140,"part":2,"q":"¿En qué consistió el histórico Sueño de las Dos Columnas que Don Bosco relató en mayo de 1862?","a":"Vio una gran nave capitaneada por el Papa en medio de una furiosa tempestad marina y atacada por innumerables barcos enemigos; la nave sólo encontró paz y salvación al amarrarse con cadenas a dos grandes columnas que surgían del océano: la columna mayor coronada por la Sagrada Eucaristía («Salus Credentium») y la otra por la Virgen Auxiliadora («Auxilium Christianorum»)."},{"num":141,"part":3,"q":"¿Quién fue el primer sucesor de Don Bosco?","a":"El primer sucesor de Don Bosco fue Don Miguel Rúa."},{"num":142,"part":3,"q":"¿En qué se distinguió Don Rúa?","a":"Don Rúa se distinguió en la SANTIDAD DE SU VIDA. Actualmente es venerado como BEATO."},{"num":143,"part":3,"q":"¿Quién fue el segundo sucesor de Don Bosco?","a":"El segundo sucesor de Don Bosco fue Don Pablo Albera."},{"num":144,"part":3,"q":"¿Del segundo sucesor, en qué se distinguió su servicio como Rector Mayor?","a":"Don Pablo Albera se distinguió en que afirmó en la Congregación el Espíritu Salesiano."},{"num":145,"part":3,"q":"¿Puedes decir en qué se descifra el Espíritu Salesiano?","a":"El Espíritu Salesiano consiste en la oración y el trabajo al servicio de los jóvenes en un clima de alegría y amabilidad, donde los jóvenes se sienten amados y correspondidos con su formación."},{"num":146,"part":3,"q":"¿Quién fue el tercer sucesor de Don Bosco?","a":"El tercer sucesor de Don Bosco fue Don Felipe Rinaldi, que actualmente es también BEATO por la Santidad de su vida."},{"num":147,"part":3,"q":"¿En qué se distinguió Don Rinaldi?","a":"Don Felipe Rinaldi se distinguió como hombre de oración y un fiel observante del espíritu Salesiano."},{"num":148,"part":3,"q":"¿Quién es el cuarto sucesor de Don Bosco?","a":"El cuarto sucesor de Don Bosco fue Don Pedro Ricaldone."},{"num":149,"part":3,"q":"¿Cuál fue una característica importante de Don Ricaldone?","a":"Don Pedro Ricaldone fue un gran escritor para la Congregación especialmente de la santidad Salesiana."},{"num":150,"part":3,"q":"¿Quién fue el quinto sucesor de Don Bosco?","a":"El quinto sucesor de Don Bosco fue Don Renato Ziggiotto, quien como Rector Mayor fue el primero en visitar México."},{"num":151,"part":3,"q":"¿Quién fue el sexto sucesor de Don Bosco?","a":"El sexto sucesor de Don Bosco fue Don Luis Ricceri, que al igual que Don Ziggiotti visitó México, pero en varias ocasiones. Le tocó promover en la Congregación las determinaciones Conciliares."},{"num":152,"part":3,"q":"¿Quién fue el séptimo sucesor de Don Bosco?","a":"El séptimo sucesor de Don Bosco fue Don Egidio Viganó, quien visitó México en varias ocasiones, además de las celebraciones Centenarias. Dio empuje al Sistema educativo y a la devoción a María Auxiliadora."},{"num":153,"part":3,"q":"¿Quién fue el octavo sucesor de Don Bosco?","a":"El octavo sucesor de Don Bosco fue Don Juan Edmundo Vecchi."},{"num":154,"part":3,"q":"¿Quién es el noveno sucesor de Don Bosco?","a":"El noveno sucesor de Don Bosco es Don Pascual Chávez Villanueva. Es de Saltillo, México y pertenece a la inspectoría de México, Guadalajara."},{"num":155,"part":3,"q":"¿Tuvo Don Bosco algún sistema especial en su labor educativa?","a":"Sí, Don Bosco tiene un Sistema especial en su labor educativa que es un tesoro en normas y criterios al que llamó sistema Preventivo."},{"num":156,"part":3,"q":"¿Por qué se llama Preventivo el Sistema Salesiano?","a":"Se llama “Preventivo” porque enseña a los educadores a prevenir y evitar el mal y más que aplicar castigos a quienes han faltado se les ayuda a descubrir y gustar el bien y la virtud."},{"num":157,"part":3,"q":"¿Cómo se logra la eficacia del Sistema Preventivo Salesiano?","a":"La eficacia del Sistema Preventivo Salesiano se logra con LA RAZÓN, EL AMOR [AMOREVOLEZZA] Y LA RELIGIÓN, en un ambiente de alegría optimismo y familiaridad."},{"num":158,"part":3,"q":"¿Cuáles son las principales devociones de Don Bosco que debe distinguir a sus Salesianos, alumnos y colaboradores?","a":"Las principales devociones son al Santísimo Sacramento, a la Santísima Virgen María y la devota obediencia al Papa."},{"num":159,"part":3,"q":"¿Cuál fue la obra más amada de San Juan Bosco?","a":"La obra más amada por San Juan Bosco ha sido el Oratorio Festivo."},{"num":160,"part":3,"q":"¿En qué consiste el Oratorio Festivo?","a":"El Oratorio Festivo consiste: en ambiente de reunión y convivencia para los jóvenes, para instruirlos y educarlos en la Fe, facilitándoles entretenimiento sano y alegre."},{"num":161,"part":3,"q":"¿Hay obras Salesianas en todo el mundo?","a":"Hay obras Salesianas en casi todo el mundo; se exceptúan lugares de difícil acceso por ser países contrarios a la fe cristiana o porque han sido expulsados de los mismos."},{"num":162,"part":3,"q":"¿Cuándo fue declarado santo Don Bosco?","a":"Don Bosco fue “Canonizado” o declarado santo el 1º de abril de 1934, Pascua de Resurrección en aquel año."},{"num":163,"part":3,"q":"¿De quiénes es actualmente Patrono San Juan Bosco?","a":"Ha sido declarado Padre y Maestro de la juventud, es además patrono de la niñez y la juventud desamparada, de los educadores, de los artistas de circo y teatro, de los zapateros, sastres y confiteros."},{"num":164,"part":3,"q":"¿Qué les prometió San Juan Bosco a los Salesianos dispuestos a seguir a Cristo?","a":"San Juan Bosco les prometió PAN, TRABAJO Y PARAÍSO."},{"num":165,"part":4,"q":"¿Para Don Bosco cuál es la base de la Santidad?","a":"Don Bosco decía: “Para nosotros la base de toda santidad consiste en estar siempre alegres”, por eso se le conoce a Don Bosco como “el santo de la alegría”."},{"num":166,"part":4,"q":"¿Cuál es según Don Bosco el mejor programa para ser felices?","a":"“Alegría, estudio y piedad es el mejor programa para ser felices y el que más beneficiará al alma”."},{"num":167,"part":4,"q":"¿En la doctrina de Don Bosco, cuál es el secreto de nuestra resistencia contra las tentaciones?","a":"Alegría, Oración y la Sagrada Comunión son el secreto de nuestra resistencia."},{"num":168,"part":4,"q":"¿Qué debemos procurar si queremos una vida alegre y tranquila?","a":"Si queremos una vida alegre y tranquila debemos procurar estar siempre EN GRACIA DE DIOS."},{"num":169,"part":4,"q":"¿Qué es lo que nos hace estar siempre satisfechos y risueños?","a":"Don Bosco decía: “¿Quieren estar siempre satisfechos y risueños? La obediencia es la que nos lleva a esa alegría”."},{"num":170,"part":4,"q":"¿Cómo debemos hacer para que nuestras alabanzas y plegarias sean agradables a Dios?","a":"“Para que nuestras Plegarias y Alabanzas sean agradables a Dios, háganlas no sólo con recogimiento de espíritu, con devoción, sino con gozo y alegría de corazón”."},{"num":171,"part":4,"q":"¿Qué acostumbraba decir Don Bosco del Alma?","a":"Del Alma Don Bosco decía: “Hijo, tienes una sola alma, es preciso que la salves”."},{"num":172,"part":4,"q":"¿Qué enseñanzas guiaron a Don Bosco en la virtud de la Caridad?","a":"Primero: “Quienes protegen a los pobres, serán ampliamente recompensados por Dios”. Segundo: “Para trabajar con éxito téngase caridad en el corazón y paciencia en la ejecución”."},{"num":173,"part":4,"q":"¿Cuál dice Don Bosco que es el medio para abrir las puertas del paraíso?","a":"Don Bosco dice: “¿Quieren entrar al Cielo? La Confesión es la cerradura y la llave es la confianza en el confesor”."},{"num":174,"part":4,"q":"¿Qué secretos da Don Bosco para el crecimiento espiritual y que nos hace un gran bien?","a":"Don Bosco nos dice: “Les comunico un secreto que puede hacerles mucho bien: ABRAN SU CORAZÓN al superior —quien será su director espiritual— depositen en él su confianza y sean profundamente sinceros”."},{"num":175,"part":4,"q":"¿Qué medios nos aconseja Don Bosco para perseverar en la vocación a la vida consagrada Salesiana?","a":"“Son necesarios VALOR Y SACRIFICIO, aunque cuesten, a fin de perseverar en la Sociedad Salesiana y sostener las obras que la Divina Providencia nos ha confiado”."},{"num":176,"part":4,"q":"¿Con qué palabras nos recuerda Don Bosco el lema salesiano?","a":"“Recuerden siempre todos los Salesianos el lema adoptado por nosotros: TRABAJO Y TEMPLANZA, pues son dos armas con las cuales llegaremos a triunfar en todo”."},{"num":177,"part":4,"q":"¿Por qué Don Bosco afirma en sus escritos pedagógicos que «la educación es cosa del corazón»?","a":"Porque sostenía que el educador no puede limitarse a impartir conocimientos o imponer normas externas, sino que debe ganarse el afecto y la confianza del educando; de modo que «los jóvenes no sólo sean amados, sino que ellos mismos se den cuenta de que son amados»."},{"num":178,"part":4,"q":"¿Cuál es la diferencia fundamental que establecía Don Bosco entre el Sistema Represivo y el Sistema Preventivo?","a":"El Sistema Represivo hace conocer la ley y luego vigila para descubrir y castigar a los transgresores, creando desconfianza y temor; el Sistema Preventivo, en cambio, hace conocer las prescripciones y asiste continuamente a los alumnos con dulzura paterna para que nunca lleguen a faltar, logrando que el deber se cumpla por convicción y amor."},{"num":179,"part":4,"q":"¿Qué papel fundamental le asignaba Don Bosco a la figura de la «Asistencia Salesiana» durante los recreos?","a":"No la concebía como una vigilancia policiaca o de espionaje, sino como una presencia cordial, activa y animadora entre los jóvenes («estar en medio de ellos»); participando en sus juegos y conversaciones para prevenir el mal, brindar consuelo y sembrar la «palabra al oído»."},{"num":180,"part":4,"q":"¿Qué criterio pedagógico mantenía Don Bosco respecto a los castigos en sus colegios?","a":"Prohibía tajantemente los castigos físicos y las humillaciones públicas; prescribía que jamás se corrigiera con ira, sino a solas, con paciencia y caridad paternal, haciendo comprender la falta para que el alumno reconociera su deber y deseara voluntariamente enmendarse."},{"num":181,"part":4,"q":"¿Por qué Don Bosco consideraba la Confesión frecuente y la Sagrada Eucaristía como los dos sostenes más firmes del Sistema Preventivo?","a":"Porque los sacramentos purifican el corazón, proporcionan la gracia divina para superar las tentaciones juveniles y hacen innecesarios los medios coercitivos externos; un joven que vive habitualmente en gracia de Dios conserva espontáneamente la paz, la pureza y la alegría interior."},{"num":182,"part":4,"q":"¿Qué características distintivas tiene la espiritualidad de la «Sociedad de la Alegría» fundada por Juan Bosco en Chieri?","a":"Mostró que la santidad cristiana es perfectamente compatible con la juventud más festiva, requiriendo solo tres compromisos esenciales: evitar todo pecado o conducta indigna de un cristiano, cumplir con máxima exactitud los deberes escolares y religiosos, y mantener siempre una alegría radiante."},{"num":183,"part":4,"q":"¿Qué importancia capital tuvieron los contratos de aprendizaje laboral redactados y firmados por Don Bosco entre 1851 y 1852?","a":"Fueron documentos jurídicos pioneros en la historia del derecho laboral europeo: Don Bosco obligaba a los patrones a enseñar honradamente el oficio, pagar un salario justo, prohibir el trabajo en domingos y fiestas religiosas, e impedir maltratos de palabra o de obra contra los muchachos aprendices."},{"num":184,"part":4,"q":"¿Qué sentido pedagógico y carismático tiene la Carta de Roma del 10 de mayo de 1884 sobre el espíritu de familia en los colegios salesianos?","a":"Es el testamento pedagógico por excelencia de Don Bosco: en ella advierte contra el peligro de la frialdad burocrática, la desconfianza y la falta de familiaridad en el patio; exhorta a los educadores a participar con pasión en los recreos para derribar la barrera de la desconfianza y restaurar el amor recíproco entre maestros y alumnos."},{"num":185,"part":5,"q":"¿Cuándo llegaron a México los primeros Salesianos?","a":"Los primeros Salesianos llegaron a México el 1º de diciembre de 1892 desembarcando en Veracruz."},{"num":186,"part":5,"q":"¿Quiénes fueron los primeros Salesianos llegados a México?","a":"Fueron cinco quienes llegaron: los padres Ángel Piccono, Rafael y Simón Visentanier, el Coadjutor Pedro Tagliaferri y el clérigo Agustín Osella."},{"num":187,"part":5,"q":"¿Cuál fue el primer colegio Salesiano en México?","a":"El primer colegio Salesiano en México fue el de Santa Julia, D.F., que se comenzó a construir en 1893."},{"num":188,"part":5,"q":"¿Quién fue el primer Salesiano Mexicano?","a":"El primer Salesiano Mexicano fue Rafael Álvarez, quién profesó temporalmente como coadjutor en 1895 pero se retiró en 1899. Le siguió Placidito Pérez que profesó en 1898 como coadjutor con profesión perpetua."},{"num":189,"part":5,"q":"¿En qué ciudades fueron las primeras fundaciones salesianas en México?","a":"Después de México DF, se fundó en Puebla (1894), Morelia (1901) y Guadalajara en 1905."},{"num":190,"part":5,"q":"¿Cuándo llegaron a México las primeras Hijas de María Auxiliadora?","a":"Las primeras Hijas de María Auxiliadora llegaron en el año de 1894."},{"num":191,"part":5,"q":"¿Cómo se llamó el primer colegio Salesiano de Guadalajara?","a":"Se llamó “Colegio del Espíritu Santo”, después lo llamaron “Colegio Italiano” hasta su incautación."},{"num":192,"part":5,"q":"¿Qué obras atienden los Salesianos de México en la actualidad?","a":"Colegios, Oratorios Festivos, Centros juveniles, Escuelas técnicas y talleres, Parroquias y templos, Misiones en Oaxaca y Chiapas, Casas de formación en la vida religiosa salesiana."},{"num":193,"part":5,"q":"¿Cómo se llama la Provincia sur o Inspectoría Salesiana de México?","a":"Se le llama “Inspectoría de Santa María de Guadalupe”."},{"num":194,"part":5,"q":"¿Cuándo nació la nueva Inspectoría con sede en Guadalajara?","a":"Nace el 30 de agosto de 1963 por decreto de los Superiores Mayores."},{"num":195,"part":5,"q":"¿Cómo se llamó a la Inspectoría de Guadalajara?","a":"Se le llamó “Inspectoría de Cristo Rey y María Auxiliadora”."},{"num":196,"part":5,"q":"¿Cuáles son las Inspectorías de las Hijas de María Auxiliadora o Salesianas en México?","a":"La Inspectoría del Sur con sede en CDMX llamada de “Nuestra Señora de Guadalupe” y la Inspectoría con sede en Monterrey llamada “Mater Ecclesiae”."},{"num":197,"part":5,"q":"¿Quiénes han sido provinciales de la Inspectoría de Guadalajara desde su nacimiento?","a":"El Padre Luis González, Padre Pablo Aguayo, Padre Salvador Nava, Padre Macrino Guzmán, Padre Humberto Meneses (quien murió siendo inspector), Padre Pascual Chávez, Padre Salvador Flores Reveles, Padre Héctor Guerrero Córdova, Padre Salvador Cleofás Murguía, Padre Hugo Orozco Sánchez, Padre Filiberto González, y a partir del mes de Febrero del 2026 el Padre Francisco Cervantes Huitron."},{"num":198,"part":5,"q":"¿Cuáles son las etapas de Formación que preparan a la Vida Religiosa Salesiana en la Inspectoría?","a":"Aspirantado y Prenoviciado en Irapuato, Guanajuato; Noviciado en Coacalco, Estado de México; Filosofía en el País de Guatemala; Teología en Tlaquepaque, Jalisco; y la capacitación para hermanos Coadjutores en El Salvador."},{"num":199,"part":5,"q":"¿En qué ciudades trabajan los Salesianos de la Inspectoría de Guadalajara?","a":"Al norte: Monterrey, Saltillo, Cd. Acuña, Nuevo Laredo, Cd. Juárez, Nogales y Chihuahua; en el Pacífico: Tijuana, Mexicali y Mochis; al Centro: Guadalajara, Amatitán, Zamora, Sahuayo, Colima; y en el bajío: Irapuato, León y San Luis Potosí; y una comunidad en las misiones en Oaxaca."},{"num":200,"part":5,"q":"¿Cuáles son los Santuarios más importantes que tienen los Salesianos de México?","a":"El Santuario Nacional de María Auxiliadora en Santa Julia, en CDMX, y el Santuario Nacional de San Juan Bosco en León, Gto."}]};

// ===== SUBTLE PAGE TURN SOUND (Web Audio API, zero external files) =====
let audioCtx = null;
function playPageSound() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const dur = 0.09;
    const bufferSize = audioCtx.sampleRate * dur;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      const env = Math.sin((i / bufferSize) * Math.PI);
      data[i] = (Math.random() * 2 - 1) * env * 0.14;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1400;
    noise.connect(filter);
    filter.connect(audioCtx.destination);
    noise.start();
  } catch (e) {}
}

// ===== BUILD PAGES & SPREADS =====
function buildBookStructure() {
  pages = [];
  // Page 0: Cover
  pages.push({ type: 'cover' });
  // Page 1: Intro + TOC
  pages.push({ type: 'toc' });

  // For each of the 5 parts
  BOOK_DATA.parts.forEach(part => {
    const partQs = BOOK_DATA.questions.filter(q => q.part === part.id);
    pages.push({
      type: 'chapter',
      part: part,
      count: partQs.length,
      startNum: partQs[0].num,
      endNum: partQs[partQs.length - 1].num
    });

    // Pack 3 questions per page (or 2 if combined text is very long, so pages feel airy & editorial!)
    let i = 0;
    while (i < partQs.length) {
      const batch = [];
      let charBudget = 0;
      while (i < partQs.length && batch.length < 3) {
        const nextLen = partQs[i].q.length + partQs[i].a.length;
        if (batch.length >= 2 && (charBudget + nextLen) > 950) break;
        batch.push(partQs[i]);
        charBudget += nextLen;
        i++;
      }
      pages.push({
        type: 'questions',
        part: part,
        items: batch
      });
    }
  });

  // Back cover
  pages.push({ type: 'back' });

  // Build desktop spreads: [cover], [p1, p2], [p3, p4], ..., [back]
  spreads = [];
  spreads.push([0]);
  let idx = 1;
  while (idx < pages.length - 1) {
    if (idx + 1 < pages.length - 1) {
      spreads.push([idx, idx + 1]);
      idx += 2;
    } else {
      spreads.push([idx, pages.length - 1]);
      idx += 2;
    }
  }
  if (spreads[spreads.length - 1].indexOf(pages.length - 1) === -1) {
    spreads.push([pages.length - 1]);
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatAnswerHtml(ansText) {
  const lines = String(ansText || '').split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length <= 1) return escapeHtml(ansText);
  let html = '';
  let inList = false;
  lines.forEach(line => {
    if (line.startsWith('•')) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${escapeHtml(line.replace(/^•\s*/, ''))}</li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<p style="margin-bottom:4px;">${escapeHtml(line)}</p>`;
    }
  });
  if (inList) html += '</ul>';
  return html;
}
