function renderView(animDir) {
  const shell = document.getElementById('bookShell');
  const spreadEl = document.getElementById('bookSpread');
  const scrubber = document.getElementById('pageScrubber');
  const indicator = document.getElementById('pageIndicator');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');

  spreadEl.classList.remove('flip-next', 'flip-prev');
  void spreadEl.offsetWidth;
  if (animDir === 'next') spreadEl.classList.add('flip-next');
  if (animDir === 'prev') spreadEl.classList.add('flip-prev');

  if (isMobile) {
    shell.classList.add('single-cover');
    spreadEl.className = 'book-spread is-single' + (animDir ? ' flip-' + animDir : '');
    spreadEl.innerHTML = renderSinglePage(currentMobilePageIdx, '');
    scrubber.max = pages.length - 1;
    scrubber.value = currentMobilePageIdx;
    indicator.textContent = currentMobilePageIdx === 0 ? 'Portada' : (currentMobilePageIdx === pages.length - 1 ? 'Final' : `Pág. ${currentMobilePageIdx} / ${pages.length - 1}`);
    btnPrev.disabled = currentMobilePageIdx <= 0;
    btnNext.disabled = currentMobilePageIdx >= pages.length - 1;
  } else {
    const sp = spreads[currentSpreadIdx] || [0];
    const isSingle = sp.length === 1;
    shell.classList.toggle('single-cover', isSingle);
    spreadEl.className = 'book-spread ' + (isSingle ? 'is-single' : 'is-spread') + (animDir ? ' flip-' + animDir : '');
    if (isSingle) {
      spreadEl.innerHTML = renderSinglePage(sp[0], '');
    } else {
      spreadEl.innerHTML = renderSinglePage(sp[0], 'left') + renderSinglePage(sp[1], 'right');
    }
    scrubber.max = spreads.length - 1;
    scrubber.value = currentSpreadIdx;
    if (currentSpreadIdx === 0) indicator.textContent = 'Portada';
    else if (currentSpreadIdx === spreads.length - 1 && isSingle) indicator.textContent = 'Contraportada';
    else indicator.textContent = `Págs. ${sp[0]}–${sp[sp.length - 1]}`;
    btnPrev.disabled = currentSpreadIdx <= 0;
    btnNext.disabled = currentSpreadIdx >= spreads.length - 1;
  }
}

function goNext() {
  if (isMobile) {
    if (currentMobilePageIdx < pages.length - 1) {
      currentMobilePageIdx++;
      playPageSound();
      renderView('next');
    }
  } else {
    if (currentSpreadIdx < spreads.length - 1) {
      currentSpreadIdx++;
      playPageSound();
      renderView('next');
    }
  }
}

function goPrev() {
  if (isMobile) {
    if (currentMobilePageIdx > 0) {
      currentMobilePageIdx--;
      playPageSound();
      renderView('prev');
    }
  } else {
    if (currentSpreadIdx > 0) {
      currentSpreadIdx--;
      playPageSound();
      renderView('prev');
    }
  }
}

function goToPage(pageIdx, qNumToHighlight = null) {
  closeModals();
  highlightedQ = qNumToHighlight;
  if (isMobile) {
    currentMobilePageIdx = Math.max(0, Math.min(pages.length - 1, pageIdx));
  } else {
    const spIdx = spreads.findIndex(sp => sp.includes(pageIdx));
    currentSpreadIdx = spIdx >= 0 ? spIdx : 0;
  }
  playPageSound();
  renderView('next');
  if (qNumToHighlight) {
    setTimeout(() => {
      const el = document.querySelector(`[data-q="${qNumToHighlight}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 120);
  }
}

function toggleMastered(qNum) {
  if (masteredSet.has(qNum)) masteredSet.delete(qNum);
  else masteredSet.add(qNum);
  saveMastered();
  renderView();
}

function revealAnswer(qNum) {
  if (!studyMode) return;
  if (revealedInStudy.has(qNum)) return;
  revealedInStudy.add(qNum);
  renderView();
}

// ===== MODALS =====
function closeModals() {
  document.querySelectorAll('.overlay').forEach(el => el.classList.remove('open'));
}

function openTocModal() {
  const body = document.getElementById('tocModalBody');
  const html = BOOK_DATA.parts.map(part => {
    const th = PART_THEMES[part.id];
    const partQs = BOOK_DATA.questions.filter(q => q.part === part.id);
    const done = partQs.filter(q => masteredSet.has(q.num)).length;
    const pct = Math.round((done / partQs.length) * 100);
    const targetPage = pages.findIndex(pg => pg.type === 'chapter' && pg.part.id === part.id);
    return `
      <button class="toc-card" onclick="goToPage(${targetPage})">
        <div class="toc-num" style="background:${th.color}">${part.id}</div>
        <div class="toc-info">
          <div class="toc-title">${escapeHtml(part.label)}: ${escapeHtml(part.title)}</div>
          <div class="toc-meta">Preguntas #${partQs[0].num}–#${partQs[partQs.length-1].num} · ${done}/${partQs.length} dominadas (${pct}%)</div>
          <div class="toc-prog-bar"><div class="toc-prog-fill" style="width:${pct}%;background:${th.color}"></div></div>
        </div>
        <span style="color:#64748B;font-weight:900;">→</span>
      </button>
    `;
  }).join('');
  body.innerHTML = html;
  document.getElementById('modalToc').classList.add('open');
}

function normStr(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function renderSearchResults(query) {
  const container = document.getElementById('searchResults');
  const q = normStr(query.trim());
  if (!q) {
    container.innerHTML = `<p style="font-size:12.5px;color:#64748B;text-align:center;padding:12px;">Escribe una palabra clave o un número de pregunta (1–200).</p>`;
    return;
  }
  const matches = BOOK_DATA.questions.filter(item =>
    String(item.num) === q || normStr(item.q).includes(q) || normStr(item.a).includes(q)
  ).slice(0, 25);

  if (matches.length === 0) {
    container.innerHTML = `<p style="font-size:13px;color:#64748B;text-align:center;padding:14px;">No se encontraron coincidencias para «${escapeHtml(query)}».</p>`;
    return;
  }

  container.innerHTML = matches.map(item => {
    const pgIdx = pages.findIndex(pg => pg.type === 'questions' && pg.items.some(x => x.num === item.num));
    return `
      <div class="search-item" onclick="goToPage(${pgIdx}, ${item.num})">
        <div class="search-item-q">#${item.num} · ${escapeHtml(item.q)}</div>
        <div class="search-item-a">${escapeHtml(item.a)}</div>
      </div>
    `;
  }).join('');
}

// ===== MINI QUIZ (10 RANDOM QUESTIONS) =====
let quizPool = [];
let quizIdx = 0;
let quizScore = 0;
let quizStreak = 0;
let quizRevealed = false;

function openQuizModal() {
  const shuffled = [...BOOK_DATA.questions].sort(() => Math.random() - 0.5);
  quizPool = shuffled.slice(0, 10);
  quizIdx = 0;
  quizScore = 0;
  quizStreak = 0;
  quizRevealed = false;
  renderQuizStep();
  document.getElementById('modalQuiz').classList.add('open');
}

function renderQuizStep() {
  const body = document.getElementById('quizModalBody');
  if (quizIdx >= quizPool.length) {
    const emoji = quizScore >= 9 ? '🏆' : quizScore >= 7 ? '🔥' : '📖';
    const msg = quizScore >= 9 ? '¡Nivel Campeón Salesiano!' : quizScore >= 7 ? '¡Muy bien! Ya casi dominas el banco.' : '¡Buen intento! Sigue repasando en el libro.';
    body.innerHTML = `
      <div style="text-align:center;padding:14px 6px;">
        <div style="font-size:48px;">${emoji}</div>
        <h3 class="serif" style="font-size:24px;margin-top:8px;color:#141E46;">${quizScore} / ${quizPool.length} Aciertos</h3>
        <p style="font-size:13.5px;color:#475569;margin-top:6px;">${msg}</p>
        <div class="quiz-actions" style="margin-top:18px;">
          <button class="qbtn primary" onclick="openQuizModal()">🔄 Nuevo Reto de 10</button>
          <button class="qbtn" style="background:#E2E8F0;color:#1E293B;" onclick="closeModals()">Volver al Libro</button>
        </div>
      </div>
    `;
    return;
  }

  const item = quizPool[quizIdx];
  const th = PART_THEMES[item.part];
  body.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#64748B;">
      <span>Pregunta ${quizIdx + 1} de ${quizPool.length} (Banco #${item.num})</span>
      <span style="color:#059669;">Aciertos: ${quizScore} · Racha: 🔥${quizStreak}</span>
    </div>
    <div class="quiz-card">
      <span style="font-size:10.5px;font-weight:800;color:${th.color};text-transform:uppercase;">Parte ${item.part}</span>
      <div class="quiz-q">${escapeHtml(item.q)}</div>
      ${quizRevealed ? `
        <div class="quiz-a"><strong>Respuesta oficial:</strong><br/>${formatAnswerHtml(item.a)}</div>
        <div class="quiz-actions">
          <button class="qbtn ok" onclick="answerQuiz(true)">✓ Sí la sabía</button>
          <button class="qbtn miss" onclick="answerQuiz(false)">✕ Fallé / Repasar</button>
        </div>
      ` : `
        <div class="quiz-actions">
          <button class="qbtn primary" onclick="quizRevealed=true;renderQuizStep();">👁️ Ver Respuesta</button>
        </div>
      `}
    </div>
  `;
}

function answerQuiz(correct) {
  const item = quizPool[quizIdx];
  if (correct) {
    quizScore++;
    quizStreak++;
    masteredSet.add(item.num);
    saveMastered();
  } else {
    quizStreak = 0;
  }
  quizIdx++;
  quizRevealed = false;
  renderQuizStep();
}

  document.getElementById('modalSearch').classList.add('open');

  studyMode = !studyMode;

  document.getElementById('btnStudy').classList.toggle('active', studyMode);
  renderView();

document.getElementById('btnSound').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  document.getElementById('btnSound').innerHTML = soundEnabled ? '<span>🔊</span>' : '<span>🔇</span>';
});

document.getElementById('pageScrubber').addEventListener('input', e => {
  const v = parseInt(e.target.value, 10);
  highlightedQ = null;
  if (isMobile) currentMobilePageIdx = v;
  else currentSpreadIdx = v;
  renderView();
});

// Close modal clicking backdrop
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov) closeModals(); });
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (document.querySelector('.overlay.open')) {
    if (e.key === 'Escape') closeModals();
    return;
  }
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
});

// Touch swipe for mobile/tablet
let touchStartX = 0;
let touchStartY = 0;
const stageEl = document.getElementById('stage');
stageEl.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });
stageEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.3) {
    if (dx < 0) goNext();
    else goPrev();
  }
}, { passive: true });

window.addEventListener('resize', () => {
  const nowMobile = window.innerWidth <= 900;
  if (nowMobile !== isMobile) {
    if (nowMobile) {
      currentMobilePageIdx = (spreads[currentSpreadIdx] && spreads[currentSpreadIdx][0]) || 0;
    } else {
      const spIdx = spreads.findIndex(sp => sp.includes(currentMobilePageIdx));
      currentSpreadIdx = spIdx >= 0 ? spIdx : 0;
    }
    isMobile = nowMobile;
    renderView();
  }
});

      <img src="${ESFER_URI}" alt="Esfer Salesianos" />
      <div class="p-cover-title">
        <h1 class="serif">CONCURSO DON BOSCO 2027</h1>

      </div>
      <img src="${PASTORAL_URI}" alt="Pastoral" />
    </div>
  `;
  BOOK_DATA.parts.forEach(part => {
    const th = PART_THEMES[part.id];
    const qs = BOOK_DATA.questions.filter(q => q.part === part.id);
    html += `
      <div class="p-part-header" style="background:${th.color};">
        <h2>${escapeHtml(part.label)}: ${escapeHtml(part.title)}</h2>
        <p>${escapeHtml(part.subtitle)}</p>

        </div>
      `;
    });
  });
  host.innerHTML = html;
  host.dataset.ready = '1';
}

function printBook() {
  closeModals();
  buildPrintableBook();
  setTimeout(() => window.print(), 120);
}

document.getElementById('btnPrint').addEventListener('click', printBook);
