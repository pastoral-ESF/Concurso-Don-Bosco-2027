<style>
  :root {
    --paper: #FFFDF7;
    --paper-edge: #F3ECE0;
    --ink: #1E293B;
    --muted: #64748B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at 50% 20%, #1D4ED8 0%, #4338CA 55%, #0F172A 100%);
    color: #F8FAFC;
    overflow: hidden;
    user-select: none;
  }
  .display { font-family: 'Fredoka', 'Nunito', sans-serif; }

  /* ===== TOP BAR ===== */
  .topbar {
    height: 58px; padding: 0 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(12px);
    border-bottom: 1.5px solid rgba(255,255,255,0.1);
    position: relative; z-index: 40;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { height: 32px; width: auto; border-radius: 7px; background: #FFF; padding: 2px 5px; }
  .brand-title { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14.5px; color: #FFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { font-size: 10.5px; color: #99F6E4; font-weight: 700; }

  .toolbar-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .star-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(251,191,36,0.18); border: 1.5px solid #FBBF24;
    color: #FEF08A; font-family: 'Fredoka', sans-serif; font-size: 12.5px; font-weight: 700;
  }
  .tb-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 11px; border-radius: 11px;
    border: 1.5px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.09); color: #F1F5F9;
    font-family: 'Fredoka', sans-serif; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.18s ease; white-space: nowrap;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
  .tb-btn.active { background: #FBBF24; color: #0F172A; border-color: #FEF08A; }
  .tb-btn.accent { background: linear-gradient(135deg, #F97316, #E11D48); color: #FFF; border-color: rgba(255,255,255,0.28); }

  /* ===== STAGE ===== */
  .stage {
    height: calc(100% - 114px);
    display: flex; align-items: center; justify-content: center;
    position: relative; padding: 14px 58px;
    perspective: 2200px; overflow: hidden;
  }
  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(15,23,42,0.75); color: #FFF;
    font-size: 22px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 25; transition: all 0.2s ease;
    box-shadow: 0 8px 22px rgba(0,0,0,0.32);
  }
  .nav-arrow:hover:not(:disabled) { background: #FBBF24; color: #0F172A; transform: translateY(-50%) scale(1.08); }
  .nav-arrow:disabled { opacity: 0.22; cursor: not-allowed; }
  .nav-arrow.prev { left: 10px; }
  .nav-arrow.next { right: 10px; }

  .book-shell {
    width: 100%; max-width: 1080px;
    height: 100%; max-height: 680px;
    display: flex; align-items: stretch; justify-content: center; position: relative;
  }
  .book-shell.single-cover { max-width: 530px; }

  .book-spread {
    width: 100%; height: 100%; display: flex; position: relative;
    border-radius: 18px;
    box-shadow: 0 28px 62px rgba(0,0,0,0.52), 0 8px 20px rgba(0,0,0,0.3);
    background: var(--paper-edge); transform-style: preserve-3d;
  }
  .book-spread.flip-next { animation: flipNext 0.4s cubic-bezier(0.22,1,0.36,1); }
  .book-spread.flip-prev { animation: flipPrev 0.4s cubic-bezier(0.22,1,0.36,1); }
  @keyframes flipNext { 0% { transform: rotateY(0); } 40% { transform: rotateY(-12deg) scale(0.985); } 100% { transform: rotateY(0); } }
  @keyframes flipPrev { 0% { transform: rotateY(0); } 40% { transform: rotateY(12deg) scale(0.985); } 100% { transform: rotateY(0); } }

  .book-spread.is-spread::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 32px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, rgba(15,23,42,0) 0%, rgba(15,23,42,0.13) 47%, rgba(15,23,42,0.2) 50%, rgba(15,23,42,0.11) 53%, rgba(15,23,42,0) 100%);
    pointer-events: none; z-index: 12;
  }

  .page {
    flex: 1; width: 50%; height: 100%;
    background: var(--paper); color: var(--ink);
    position: relative; display: flex; flex-direction: column; overflow: hidden; user-select: text;
  }
  .book-spread.is-spread .page.left { border-radius: 18px 0 0 18px; border-right: 1px solid rgba(15,23,42,0.08); }
  .book-spread.is-spread .page.right { border-radius: 0 18px 18px 0; }
  .book-spread.is-single .page { width: 100%; border-radius: 18px; }

  /* ===== COVER ===== */
  .cover-page {
    height: 100%; padding: 28px 30px;
    background: linear-gradient(155deg, #EA580C 0%, #1D4ED8 55%, #1E1B4B 100%);
    color: #FFF; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center;
    position: relative; overflow: hidden;
  }
  .cover-page::before {
    content: ''; position: absolute; inset: 14px;
    border: 2.5px dashed rgba(253, 230, 138, 0.5); border-radius: 14px; pointer-events: none;
  }
  .cover-logos { display: flex; gap: 14px; z-index: 2; }
  .cover-logos img { height: 44px; width: auto; background: #FFF; padding: 4px 10px; border-radius: 11px; box-shadow: 0 6px 16px rgba(0,0,0,0.22); }
  .cover-badge {
    display: inline-block; padding: 6px 16px; border-radius: 999px;
    background: #FBBF24; color: #1E1B4B;
    font-family: 'Fredoka', sans-serif; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em;
  }
  .cover-title { font-family: 'Fredoka', sans-serif; font-size: clamp(28px, 3.8vw, 42px); line-height: 1.08; color: #FFF; }
  .cover-desc { font-size: 14px; line-height: 1.52; color: #E0F2FE; max-width: 390px; font-weight: 700; }
  .cover-cta {
    padding: 13px 28px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, #FDE047, #F59E0B); color: #1E1B4B;
    font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700;
    cursor: pointer; box-shadow: 0 10px 24px rgba(245,158,11,0.45);
    transition: transform 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
  }
  .cover-cta:hover { transform: translateY(-2px) scale(1.04); }

  /* ===== PAGE CHROME ===== */
  .page-header {
    padding: 14px 22px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px dotted rgba(15,23,42,0.1); flex-shrink: 0;
  }
  .page-part-tag { font-family: 'Fredoka', sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; display: inline-flex; align-items: center; gap: 7px; }
  .page-part-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .page-range { font-size: 11px; font-weight: 800; color: #64748B; }
  .page-body { flex: 1; padding: 14px 22px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 13px; }
  .page-body::-webkit-scrollbar { width: 5px; }
  .page-body::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.25); border-radius: 99px; }
  .page-footer {
    padding: 8px 22px 12px; display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: #94A3B8; font-weight: 800;
    border-top: 1px solid rgba(15,23,42,0.06); flex-shrink: 0;
  }

  /* ===== TOC ===== */
  .toc-intro {
    background: linear-gradient(135deg, #CCFBF1, #FEF3C7);
    border: 1.5px solid #99F6E4; border-radius: 14px; padding: 12px 14px;
    font-size: 12.5px; line-height: 1.48; color: #1E293B; font-weight: 700;
  }
  .toc-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .toc-card {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-radius: 14px; background: #FFF; border: 2px solid #E2E8F0;
    cursor: pointer; transition: all 0.18s ease; text-align: left;
  }
  .toc-card:hover { transform: translateX(4px); border-color: #38BDF8; box-shadow: 0 5px 14px rgba(15,23,42,0.07); }
  .toc-num {
    width: 38px; height: 38px; border-radius: 12px; color: #FFF;
    font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .toc-info { flex: 1; min-width: 0; }
  .toc-title { font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 700; color: #0F172A; }
  .toc-meta { font-size: 11px; color: #64748B; font-weight: 700; margin-top: 2px; }
  .toc-prog-bar { height: 5px; background: #E2E8F0; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .toc-prog-fill { height: 100%; border-radius: 99px; transition: width 0.3s ease; }

  /* ===== CHAPTER OPENER ===== */
  .chapter-opener {
    height: 100%; padding: 28px 26px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; color: #FFF; overflow: hidden;
  }
  .chapter-opener::before {
    content: ''; position: absolute; inset: 14px;
    border: 2px dashed rgba(255,255,255,0.3); border-radius: 14px; pointer-events: none;
  }
  .ch-top { z-index: 2; display: flex; justify-content: space-between; align-items: center; }
  .ch-pill {
    padding: 5px 13px; border-radius: 999px;
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3);
    font-family: 'Fredoka', sans-serif; font-size: 11.5px; font-weight: 700;
  }
  .ch-mid { z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
  .ch-emblem {
    width: 104px; height: 104px; border-radius: 28px;
    background: rgba(255,255,255,0.16); border: 3px solid rgba(254,240,138,0.65);
    display: flex; align-items: center; justify-content: center; font-size: 48px;
    box-shadow: 0 12px 26px rgba(0,0,0,0.22);
  }
  .ch-title { font-family: 'Fredoka', sans-serif; font-size: clamp(24px, 2.6vw, 31px); line-height: 1.15; }
  .ch-sub { font-size: 13.5px; line-height: 1.5; color: rgba(255,255,255,0.92); max-width: 360px; font-weight: 700; }
  .ch-quote {
    z-index: 2; padding: 12px 15px; border-radius: 13px;
    background: rgba(0,0,0,0.22); border-left: 4px solid #FDE047;
    font-size: 12.5px; font-style: italic; font-weight: 700; color: #FEF9C3; line-height: 1.45;
  }

  /* ===== QUESTION CARD (AIRY, 2 PER PAGE FOR KIDS) ===== */
  .q-card {
    background: #FFFFFF;
    border: 2px solid #E2E8F0;
    border-left: 6px solid var(--q-accent, #0D9488);
    border-radius: 16px;
    padding: 14px 15px;
    box-shadow: 0 4px 12px rgba(15,23,42,0.045);
    transition: all 0.2s ease;
  }
  .q-card.highlighted { box-shadow: 0 0 0 3px #F59E0B; background: #FFFBEB; }
  .q-card.mastered { background: #F0FDF4; border-color: #86EFAC; }

  .q-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  .q-num-wrap { display: flex; align-items: flex-start; gap: 9px; flex: 1; }
  .q-num {
    min-width: 32px; height: 26px; padding: 0 7px; border-radius: 9px;
    background: var(--q-accent, #0D9488); color: #FFF;
    font-family: 'Fredoka', sans-serif; font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }
  .q-text { font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 600; color: #0F172A; line-height: 1.35; }
  .q-btns { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .mini-btn {
    border: 1.5px solid #CBD5E1; background: #F8FAFC; color: #475569;
    border-radius: 999px; padding: 3px 9px;
    font-family: 'Fredoka', sans-serif; font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.15s ease;
  }
  .mini-btn:hover { border-color: #0EA5E9; color: #0284C7; }
  .mini-btn.done { background: #FEF08A; border-color: #F59E0B; color: #92400E; }

  .a-box {
    font-size: 14px; line-height: 1.5; color: #1E293B; font-weight: 700;
    padding: 10px 13px; border-radius: 12px;
    background: #F8FAFC; border: 1.5px solid #E2E8F0;
  }
  .a-box ul { margin: 5px 0 2px 18px; display: flex; flex-direction: column; gap: 3px; }
  .a-box.hidden-study {
    cursor: pointer; background: linear-gradient(135deg, #FEF3C7, #FDE68A);
    border: 2px dashed #F59E0B; text-align: center; padding: 13px;
  }
  .a-box.hidden-study .a-content { display: none; }
  .a-box.hidden-study .a-reveal-prompt {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 700; color: #92400E;
  }
  .a-box:not(.hidden-study) .a-reveal-prompt { display: none; }

  /* ===== BOTTOM BAR ===== */
  .bottombar {
    height: 56px; padding: 0 18px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
    border-top: 1.5px solid rgba(255,255,255,0.1); position: relative; z-index: 40;
  }
  .scrubber-wrap { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 640px; }
  .page-indicator { font-family: 'Fredoka', sans-serif; font-size: 13px; font-weight: 700; color: #FEF08A; white-space: nowrap; min-width: 92px; text-align: center; }
  input[type="range"].scrubber { flex: 1; accent-color: #FBBF24; height: 6px; cursor: pointer; }

  /* ===== MODALS ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.75); backdrop-filter: blur(6px);
    z-index: 80; display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.open { display: flex; }
  .modal-box {
    width: 100%; max-width: 560px; max-height: 86vh;
    background: #FFFDF7; color: #0F172A; border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.48); display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-head { padding: 16px 20px; background: linear-gradient(135deg, #0D9488, #1D4ED8); color: #FFF; display: flex; align-items: center; justify-content: space-between; }
  .modal-head h3 { font-family: 'Fredoka', sans-serif; font-size: 17px; }
  .modal-close { width: 32px; height: 32px; border-radius: 9px; border: none; background: rgba(255,255,255,0.18); color: #FFF; font-size: 20px; cursor: pointer; }
  .modal-body { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .search-input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 2px solid #CBD5E1; font-family: inherit; font-size: 14px; font-weight: 700; outline: none; }
  .search-input:focus { border-color: #0D9488; }
  .search-item { padding: 10px 13px; border-radius: 11px; border: 1.5px solid #E2E8F0; background: #FFF; cursor: pointer; }
  .search-item:hover { background: #F0FDFA; border-color: #2DD4BF; }
  .quiz-actions { display: flex; gap: 10px; margin-top: 12px; }
  .qbtn { flex: 1; padding: 12px 14px; border-radius: 12px; border: none; font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }
  .qbtn.primary { background: #1D4ED8; color: #FFF; }
  .qbtn.ok { background: #10B981; color: #FFF; }
  .qbtn.miss { background: #F59E0B; color: #0F172A; }

  @media (max-width: 900px) {
    .stage { padding: 10px 8px; }
    .nav-arrow { width: 36px; height: 36px; font-size: 17px; }
    .nav-arrow.prev { left: 4px; }
    .nav-arrow.next { right: 4px; }
    .tb-btn .lbl { display: none; }
    .brand-sub { display: none; }
    .page-header, .page-body, .page-footer { padding-left: 14px; padding-right: 14px; }
  }

  /* ===== PRINTABLE PDF ===== */
  .print-only { display: none; }
  @media print {
    @page { size: letter; margin: 1.2cm 1.4cm; }
    html, body { height: auto !important; overflow: visible !important; background: #FFF !important; color: #0F172A !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .topbar, .stage, .bottombar, .overlay { display: none !important; }
    .print-only { display: block !important; }
    .p-cover { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 3px solid #0D9488; }
    .p-cover img { height: 42px; width: auto; }
    .p-cover-title { text-align: center; flex: 1; }
    .p-cover-title h1 { font-family: 'Fredoka', sans-serif; font-size: 20px; color: #0F766E; }
    .p-cover-title p { font-size: 11px; color: #475569; font-weight: 700; }
    .p-part-header { margin: 14px 0 8px; padding: 7px 12px; border-radius: 8px; color: #FFF; break-after: avoid; page-break-after: avoid; }
    .p-part-header h2 { font-family: 'Fredoka', sans-serif; font-size: 14px; }
    .p-item { border: 1.5px solid #E2E8F0; border-left: 5px solid #0D9488; border-radius: 8px; padding: 8px 11px; margin-bottom: 7px; break-inside: avoid; page-break-inside: avoid; background: #FFFDF7; }
    .p-q { font-family: 'Fredoka', sans-serif; font-size: 12px; color: #0F172A; margin-bottom: 3px; }
    .p-a { font-size: 11.5px; color: #334155; font-weight: 700; line-height: 1.4; }
    .p-a ul { margin: 3px 0 1px 16px; }
  }
</style>

const BOOK_DATA = {"parts":[{"id":1,"label":"CAPÍTULO 1","title":"Infancia y el Sueño de los 9 Años","subtitle":"Nacimiento en I Becchi, su familia, el sueño vocacional, Primera Comunión y sus juegos."},{"id":2,"label":"CAPÍTULO 2","title":"Chieri, el Seminario y el Sacerdocio","subtitle":"La Sociedad de la Alegría, sus oficios, Luis Comollo y su ordenación sacerdotal."},{"id":3,"label":"CAPÍTULO 3","title":"El Oratorio, María Auxiliadora y la Familia Salesiana","subtitle":"Bartolomé Garelli, Casa Pinardi, Valdocco, el perro Gris, misiones y Salesianas."},{"id":4,"label":"CAPÍTULO 4","title":"Sistema Preventivo, Alegría y Sucesores","subtitle":"Los tres pilares educativos, los sueños de Don Bosco, su santidad y los Rectores Mayores."}],"questions":[{"num":1,"part":1,"q":"Lugar y fecha del nacimiento de Don Bosco.","a":"Don Bosco nació en I Becchi (Italia), el 16 de agosto de 1815."},{"num":2,"part":1,"q":"¿Cuál es el nombre completo de Don Bosco?","a":"Juan Melchor Bosco Occhiena (se pronuncia Oquiena)."},{"num":3,"part":1,"q":"¿Cómo se llamaban los papás de Don Bosco?","a":"Sus padres se llamaban Francisco Luis Bosco y Margarita Occhiena."},{"num":4,"part":1,"q":"Don Bosco tenía un hermanastro y un hermano. ¿Cómo se llamaban?","a":"El hermanastro se llamaba Antonio y el hermano José."},{"num":5,"part":1,"q":"¿Cuántos años tenía Don Bosco cuando murió su papá?","a":"Juanito Bosco tenía sólo dos años cuando murió su papá."},{"num":6,"part":1,"q":"¿Cuántos años tenía Juanito Bosco cuando tuvo un sueño que marcó su vida y su vocación?","a":"Tenía 9 años."},{"num":7,"part":1,"q":"Pequeña explicación del sueño que tuvo Don Bosco a los 9 años (leer y aprender).","a":"Juanito Bosco, en el sueño vio un grupo de muchachos, que gritaban, se reían y decían malas palabras... Juanito se lanzó sobre ellos dándoles puñetazos para que se callaran.\nApareció un Señor vestido de blanco (que era Jesús) que le explicó cómo tratar a los muchachos: “No con golpes, sino con dulzura y caridad”.\nJuanito preguntó cómo lo haría y Jesús le dijo que le daría una maestra; después vio a una Señora (que era la Virgen), los muchachos se habían convertido en fieras y cuando pasaban junto a la Virgen se transformaban en corderos mansos.\nLa Virgen le dijo: “Hazte humilde, fuerte y robusto; lo que ves que pasa con estos animales, haz tú lo mismo con mis hijos”, y viendo la angustia de Juanito le dijo: “A su tiempo lo comprenderás”."},{"num":8,"part":1,"q":"¿Qué le dice su mamá acerca del sueño de los 9 años?","a":"\"Extraño sueño, quizás un día llegues a ser sacerdote\"."},{"num":9,"part":1,"q":"¿Qué decía Don Bosco cuando era chico respecto a su futuro?","a":"\"Si yo fuera sacerdote me gustaría acercarme a los niños, decirles buenas palabras y darles buenos consejos\"."},{"num":10,"part":1,"q":"¿Cuáles eran las habilidades que sobresalían en Juanito Bosco?","a":"Su inclinación por los juegos al aire libre y los entretenimientos, como caminar sobre una cuerda, el salto mortal, y el equilibrio con la varita."},{"num":11,"part":1,"q":"¿Qué dificultades tuvo Juanito para estudiar?","a":"No había escuela cerca. No tenía dinero. Su hermanastro Antonio no lo quería ver con ningún libro ni que estudiara."},{"num":12,"part":1,"q":"Juanito Bosco tomó la Primera Comunión a los 11 años. Su mamá le dio un consejo. ¿Qué le dijo?","a":"\"Juanito, éste ha sido un día grande para ti. Dios está en tu corazón. Prométele hacer todo lo posible para conservarte bueno hasta el fin de tu vida\"."},{"num":13,"part":1,"q":"¿Cuál es el nombre del sacerdote que ayudó y guió a Juanito Bosco durante un tiempo y le dio su primera clase?","a":"Don Juan Calosso."},{"num":14,"part":1,"q":"¿A qué edad debe alejarse Juanito de su casa y a dónde va?","a":"A los doce años debe alejarse de su casa para poder estudiar y comienza a trabajar de peón de campo con la familia Moglia."},{"num":15,"part":1,"q":"¿Qué hacía Juanito los domingos?","a":"Juanito los domingos entretenía y alegraba a sus amigos de Castelnuovo en un prado. Rezaban el rosario y les explicaba el Evangelio que habían escuchado en la Misa y después les divertía con juegos y malabares."},{"num":16,"part":2,"q":"¿Qué fundó Juan Bosco con sus amigos en el año 1831 en Chieri?","a":"Don Bosco fundó la \"Sociedad de la Alegría\"."},{"num":17,"part":2,"q":"¿Cuáles eran las bases para ingresar en la Sociedad de la Alegría?","a":"• 1º: Evitar toda conversación y toda acción que no sea de un buen cristiano.\n• 2º: Exactitud en el cumplimiento de los deberes escolares y religiosos.\n• 3º: Estar siempre alegre."},{"num":18,"part":2,"q":"Juan Bosco era muy pobre y necesitaba dinero para ganarse el pan y estudiar. ¿Qué hacía en Chieri?","a":"Se emplea de mozo en el café \"Pianta\", trabaja de herrero, zapatero, sastre, peluquero..."},{"num":19,"part":2,"q":"¿Qué sucedió el 30 de octubre de 1835?","a":"Juan Bosco, siguiendo el consejo de su confesor, Don Cafasso, ingresa en el seminario para hacerse sacerdote."},{"num":20,"part":2,"q":"¿Cómo paga sus estudios en el seminario de Chieri?","a":"Los mejores alumnos recibían un premio de 60 francos y Juan Bosco ganó este premio los 6 años que estuvo allí. Con esto se pagaba los estudios."},{"num":21,"part":2,"q":"¿Cómo se llamaba el compañero ejemplar que encontró en el Seminario?","a":"El compañero ejemplar se llamaba Luis Comollo (se pronuncia Comolo)."},{"num":22,"part":2,"q":"Fecha y lugar de su ordenación sacerdotal.","a":"Don Bosco fue ordenado sacerdote el 5 de junio de 1841, en la Capilla del Palacio Episcopal de Turín."},{"num":23,"part":2,"q":"¿Cuál fue el lema sacerdotal de Don Bosco?","a":"El lema sacerdotal de Don Bosco fue: \"Dadme almas y llévate lo demás\"."},{"num":24,"part":2,"q":"¿Fecha y lugar donde Don Bosco celebró su primera misa y qué gracia especial pidió?","a":"El 6 de junio de 1841 en Turín y pidió a Dios “el don de la eficacia de la palabra”."},{"num":25,"part":3,"q":"¿Qué sucede el 8 de diciembre de 1841?","a":"Inicia el Oratorio Festivo con Bartolomé Garelli (se pronuncia Gareli) en la Iglesia San Francisco de Asís, con el rezo de un Ave María."},{"num":26,"part":3,"q":"¿Qué le había prometido Don Bosco a Dios?","a":"Le había prometido a Dios dar \"hasta el último aliento (respiro) por sus queridos jóvenes”."},{"num":27,"part":3,"q":"¿Dónde se ubica definitivamente Don Bosco con sus muchachos?","a":"La meta, después de muchos cambios, es la casita Pinardi: una casita que se transformó en Capilla, la primera del oratorio."},{"num":28,"part":3,"q":"Nombra al menos 3 de los primeros colaboradores de Don Bosco:","a":"Miguel Rúa, Juan Cagliero, José Buzzetti, Victoria Alassonatti y Juan Borel."},{"num":29,"part":3,"q":"¿Qué fundó en Valdocco en favor de sus muchachos?","a":"Don Bosco fundó escuelas y talleres de artes y oficios para los hijos de las familias más necesitadas."},{"num":30,"part":3,"q":"Don Bosco escribió muchos libros. ¿Qué pensaba Don Bosco sobre las buenas lecturas?","a":"Don Bosco pensaba que las buenas lecturas eran necesarias para que los jóvenes se alejen del pecado, y que era un deber difundir la buena prensa."},{"num":31,"part":3,"q":"¿Cómo se llamó una publicación mensual ideada y difundida por Don Bosco?","a":"Se llamó \"Lecturas Católicas\"."},{"num":32,"part":3,"q":"¿Por qué Don Bosco llamó \"Salesianos\" a quienes colaboran con él?","a":"Porque el Patrono de la Congregación es San Francisco de Sales, modelo de amabilidad y dulzura."},{"num":33,"part":3,"q":"¿En qué día, mes y año se fundó la Congregación Salesiana?","a":"Se fundó el día 18 de diciembre de 1859."},{"num":34,"part":3,"q":"¿Cómo le gustaba a Don Bosco que lo llamaran sus chicos?","a":"Don Bosco decía: \"Llamadme siempre padre y seré feliz\"."},{"num":35,"part":3,"q":"¿Qué respondía Don Bosco cuando le preguntaban para qué sirve la vida?","a":"\"Para amar y servir a Dios, y ganarse el paraíso\", respondía Don Bosco."},{"num":36,"part":3,"q":"¿Cuáles son las bases que proponía Don Bosco para tener una vida feliz?","a":"Las bases que Don Bosco proponía para tener una vida feliz eran: la frecuente confesión y comunión y la Misa diaria."},{"num":37,"part":3,"q":"¿Cómo se llamaba el perro de Don Bosco? Narra algún episodio.","a":"El perro de Don Bosco se llamaba “Gris”. Una noche le salvó la vida al poner en fuga a dos malhechores que atacaron a Don Bosco con el propósito de matarlo."},{"num":38,"part":3,"q":"¿Qué inauguró Don Bosco el 20 de junio de 1852?","a":"Don Bosco inauguró La Iglesia de San Francisco de Sales."},{"num":39,"part":3,"q":"¿Cuáles eran los tres grandes amores de Don Bosco?","a":"Los tres grandes amores de Don Bosco eran: la Eucaristía, María Auxiliadora y el Papa."},{"num":40,"part":3,"q":"¿Qué decía Don Bosco sobre María Auxiliadora?","a":"\"María Auxiliadora es la Estrella del mar: pongámonos todos bajo su manto. Ella nos librará de los peligros y nos guiará a puerto seguro\"."},{"num":41,"part":3,"q":"¿Cuándo salió de Italia la Primera Expedición Misionera y hacia dónde fue?","a":"Salió del puerto de Génova el 11 de noviembre de 1875 y llegaron a Argentina."},{"num":42,"part":3,"q":"¿Qué le dijo Don Bosco a sus primeros Misioneros?","a":"\"Busquen almas, no dinero, ni honores, ni dignidades. Cuiden especialmente a los niños, a los enfermos, a los ancianos y a los pobres\"."},{"num":43,"part":3,"q":"¿Qué respondía Don Bosco cuando le pedían una opinión acerca de cuestiones políticas?","a":"Don Bosco respondía: \"Mi política es la del Padre Nuestro\"."},{"num":44,"part":3,"q":"¿Cuándo fundó junto con Santa María Mazzarello (se pronuncia Mazarelo) la rama femenina de su Congregación y cómo las llama?","a":"El 5 de agosto de 1872 y las llama Hijas de María Auxiliadora."},{"num":45,"part":3,"q":"¿Por qué motivo Don Bosco quiso fundar las Hijas de María Auxiliadora?","a":"Porque con su ayuda a las niñas más necesitadas, son un monumento vivo de acción de gracias a la Santísima Virgen."},{"num":46,"part":3,"q":"¿Qué respondía Don Bosco a los que le preguntaban sobre su trabajo en el Oratorio?","a":"Don Bosco respondía: \"Yo no estoy aquí para ganar dinero ni para hacerme famoso. Estoy aquí nada más que para hacer el bien a mis muchachos\"."},{"num":47,"part":3,"q":"Mencionar tres de los milagros que Don Bosco hizo delante de los jóvenes.","a":"Multiplicación de las hostias, de los panes y de las castañas."},{"num":48,"part":3,"q":"¿Cuáles son las tres ramas de la Familia Salesiana que Don Bosco fundó?","a":"Los Salesianos, las Hijas de María Auxiliadora y los Cooperadores Salesianos."},{"num":49,"part":4,"q":"¿Quiénes son los Cooperadores Salesianos?","a":"Son personas laicas que colaboran con los Salesianos en el mismo trabajo de ayudar a los jóvenes a ser buenos cristianos y honrados ciudadanos."},{"num":50,"part":4,"q":"Nombrar, del Oratorio de Don Bosco, tres jóvenes famosos por su santidad.","a":"Domingo Savio, Miguel Magone y Francisco Besucco."},{"num":51,"part":4,"q":"¿Qué cosas prometía Don Bosco a los que lo seguían, y se hacían llamar Salesianos?","a":"Don Bosco les prometía: \"Pan, Trabajo y Paraíso\"."},{"num":52,"part":4,"q":"¿Cuáles son los tres pilares del sistema educativo de Don Bosco?","a":"Los tres pilares de su sistema educativo son: razón, religión y amabilidad."},{"num":53,"part":4,"q":"En su última Misa Don Bosco se emocionó hasta las lágrimas. ¿Qué exclamó, recordando el sueño de los nueve años, y viendo cómo la Virgen fue guiando su camino?","a":"Don Bosco exclamó: \"Todo lo hizo María Auxiliadora\"."},{"num":54,"part":4,"q":"¿Qué dice Don Bosco de los que viven en gracia de Dios?","a":"Don Bosco decía que los que viven en gracia de Dios están siempre alegres y conservan la paz en el corazón."},{"num":55,"part":4,"q":"Don Bosco preguntaba: \"¿Quién es el mejor amigo de los jóvenes en el Oratorio?\", ¿qué les decía él mismo?","a":"Don Bosco decía: \"El mejor amigo es Jesús; Él distribuye las gracias y la alegría, y consuela en los momentos de tristeza\"."},{"num":56,"part":4,"q":"Don Bosco quería que en sus Colegios reinase mucha alegría. ¿Qué decía sobre la música?","a":"Don Bosco decía: \"Un colegio sin música es como un cuerpo sin alma\"."},{"num":57,"part":4,"q":"¿Cuáles son las virtudes que Don Bosco recomendaba practicar a sus muchachos?","a":"Don Bosco recomendaba practicar: la caridad, la pureza, la humildad y la obediencia."},{"num":58,"part":4,"q":"En la \"Sociedad de Geografía\" de Lyon, Francia, en 1883 Don Bosco pronunció una conferencia que le mereció una medalla. ¿Cuál fue el tema que desarrolló?","a":"Don Bosco, sin conocerla y sin haber estado, desarrolló el tema de la flora y la fauna de la Patagonia, que había visto en sueños."},{"num":59,"part":4,"q":"¿Qué recomendaba Don Bosco evitar a sus muchachos?","a":"Don Bosco recomendaba evitar: el ocio, las malas compañías y las malas conversaciones."},{"num":60,"part":4,"q":"Don Bosco era famoso por sus \"sueños\". ¿Cuántos conocemos y sobre qué se refieren?","a":"Conocemos 144 \"sueños\", y se refieren a: la Congregación Salesiana, al Oratorio y a la Iglesia."},{"num":61,"part":4,"q":"¿Qué recomendaba Don Bosco a sus exalumnos?","a":"Don Bosco les decía: \"En cualquier lugar que estén, recuerden siempre que son hijos de Don Bosco, y demuestren que son buenos cristianos y honrados ciudadanos\"."},{"num":62,"part":4,"q":"¿Cómo decía Don Bosco que había que hacer las cosas?","a":"Don Bosco decía: \"A Dios no le gustan las cosas hechas por la fuerza. A Dios, que es Amor, le gusta que las cosas sean hechas por amor\"."},{"num":63,"part":4,"q":"Según Don Bosco, ¿cuál será el día más hermoso de nuestras vidas?","a":"El día más hermoso de nuestras vidas será cuando entre nosotros reine la caridad y el amor."},{"num":64,"part":4,"q":"¿Qué repetían los muchachos del Oratorio de Don Bosco acerca de la santidad?","a":"\"Nosotros hacemos consistir la santidad en estar siempre alegres en el Señor\"."},{"num":65,"part":4,"q":"¿Qué les decía Don Bosco a los muchachos que entraban en el Oratorio?","a":"\"En la presencia de Dios, les aseguro, es suficiente el entrar en una casa Salesiana para que sean protegidos de una manera especial por María Auxiliadora\"."},{"num":66,"part":4,"q":"Don Bosco tuvo un sueño en el que la Iglesia estaba representada por una barca, la que era asediada por otras embarcaciones. Pero la barca de la Iglesia se aferró a dos columnas que la salvaron. ¿Qué significa cada columna?","a":"Las dos columnas representaban: la Eucaristía y la Santísima Virgen."},{"num":67,"part":4,"q":"Don Bosco realizó muchos milagros por intercesión de la Virgen. ¿Qué decía con respecto a los mismos?","a":"Don Bosco decía: \"No soy yo, es la Virgen quien los realiza. Confiad en ella y veréis lo que son milagros\"."},{"num":68,"part":4,"q":"¿Cuándo murió Don Bosco?","a":"Don Bosco murió el 31 de enero de 1888, a los 72 años, en Turín."},{"num":69,"part":4,"q":"¿Qué sucedió el 1.º de abril de 1934?","a":"Don Bosco es declarado \"Santo\" por el Papa Pío XI."},{"num":70,"part":4,"q":"Nombra al menos cinco de los sucesores de Don Bosco en el gobierno de la Congregación Salesiana, incluyendo al actual Rector Mayor de los Salesianos.","a":"• Miguel Rúa\n• Pablo Albera\n• Felipe Rinaldi\n• Pedro Ricaldone\n• Renato Ziggiotti\n• Luis Ricceri\n• Egidio Viganó\n• Juan Edmundo Vecchi\n• Pascual Chávez\n• Ángel Fernández Artime\n• Fabio Attard (actual Rector Mayor de los Salesianos)"}]};

function speakText(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-MX'; u.rate = 0.94;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatAnswerHtml(ansText) {
  const lines = String(ansText || '').split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length <= 1) return escapeHtml(ansText);
  let html = '', inList = false;
  lines.forEach(line => {
    if (line.startsWith('•')) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${escapeHtml(line.replace(/^•\s*/, ''))}</li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<p style="margin-bottom:4px;">${escapeHtml(line)}</p>`;
    }
  });
  if (inList) html += '</ul>';
  return html;
}

function buildBookStructure() {
  pages = [{ type: 'cover' }, { type: 'toc' }];
  BOOK_DATA.parts.forEach(part => {
    const qs = BOOK_DATA.questions.filter(q => q.part === part.id);
    pages.push({ type: 'chapter', part, count: qs.length, startNum: qs[0].num, endNum: qs[qs.length - 1].num });
    for (let i = 0; i < qs.length; i += 2) {
      pages.push({ type: 'questions', part, items: qs.slice(i, i + 2) });
    }
  });
  pages.push({ type: 'back' });

  spreads = [[0]];
  let idx = 1;
  while (idx < pages.length - 1) {
    spreads.push(idx + 1 < pages.length - 1 ? [idx, idx + 1] : [idx, pages.length - 1]);
    idx += 2;
  }
  if (!spreads[spreads.length - 1].includes(pages.length - 1)) spreads.push([pages.length - 1]);
}

            <span class="cover-badge">✨ Categoría Primaria Mayor · 2027 ✨</span>

            <p class="cover-desc">Libro Digital Interactivo con las <strong>70 preguntas y respuestas oficiales</strong> en 4 capítulos ilustrados para estudiar jugando.</p>
            <button class="cover-cta" onclick="goNext()">¡Abrir Libro! <span>→</span></button>
          </div>
          <div style="z-index:2;font-size:12px;color:#CCFBF1;font-weight:800;">Departamento de Pastoral · ESFER Salesianos</div>
        </div>
      </div>
    `;
  }

  if (p.type === 'toc') {
    const cards = BOOK_DATA.parts.map(part => {
      const th = PART_THEMES[part.id];
      const qs = BOOK_DATA.questions.filter(q => q.part === part.id);
      const done = qs.filter(q => masteredSet.has(q.num)).length;
      const pct = Math.round((done / qs.length) * 100);
      const target = pages.findIndex(pg => pg.type === 'chapter' && pg.part.id === part.id);
      return `
        <button class="toc-card" onclick="goToPage(${target})">
          <div class="toc-num" style="background:${th.color}">${th.emoji}</div>
          <div class="toc-info">
            <div class="toc-title">${escapeHtml(part.title)}</div>
            <div class="toc-meta">Preguntas ${qs[0].num}–${qs[qs.length-1].num} · ⭐ ${done}/${qs.length} listas</div>
            <div class="toc-prog-bar"><div class="toc-prog-fill" style="width:${pct}%;background:${th.color}"></div></div>
          </div>
          <span style="color:#64748B;font-weight:900;">→</span>
        </button>
      `;
    }).join('');
    return `
      <div class="page ${sideClass}">
        <div class="page-header">
          <span class="page-part-tag" style="color:#0D9488"><span class="page-part-dot" style="background:#F59E0B"></span>ÍNDICE DE AVENTURA</span>
          <span class="page-range">70 Preguntas</span>
        </div>
        <div class="page-body">
          <div class="toc-intro">Toca cualquier capítulo para empezar, usa <strong>🔊</strong> para escuchar las preguntas en voz alta, o activa <strong>🎁 Modo Adivina</strong> para jugar con tus papás.</div>
          <div class="toc-list">${cards}</div>
        </div>
        <div class="page-footer"><span>Primaria Mayor · 2027</span><span>Pág. ${pageIdx}</span></div>
      </div>
    `;
  }

  if (p.type === 'chapter') {
    const th = PART_THEMES[p.part.id];
    return `
      <div class="page ${sideClass}">
        <div class="chapter-opener" style="background:${th.grad}">
          <div class="ch-top"><span class="ch-pill">${escapeHtml(p.part.label)}</span><span class="ch-pill">${th.era}</span></div>
          <div class="ch-mid">
            <div class="ch-emblem">${th.emoji}</div>
            <h2 class="ch-title">${escapeHtml(p.part.title)}</h2>
            <p class="ch-sub">${escapeHtml(p.part.subtitle)}</p>
          </div>
          <div class="ch-quote">${th.quote}</div>
        </div>
      </div>
    `;
  }

  if (p.type === 'questions') {
    const th = PART_THEMES[p.part.id];
    const cards = p.items.map(item => {
      const isMastered = masteredSet.has(item.num);
      const isHidden = studyMode && !revealedInStudy.has(item.num);
      const isHi = highlightedQ === item.num;
      const readStr = (isHidden ? item.q : `${item.q} ... Respuesta: ${item.a}`).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
      return `
        <article class="q-card ${isMastered ? 'mastered' : ''} ${isHi ? 'highlighted' : ''}" style="--q-accent:${th.color}" data-q="${item.num}">
          <div class="q-head">
            <div class="q-num-wrap">
              <span class="q-num">#${item.num}</span>
              <div class="q-text">${escapeHtml(item.q)}</div>
            </div>
            <div class="q-btns">
              <button class="mini-btn" onclick="speakText('${readStr}')" title="Escuchar">🔊</button>
              <button class="mini-btn ${isMastered ? 'done' : ''}" onclick="toggleMastered(${item.num})">${isMastered ? '⭐ Lista' : '☆'}</button>
            </div>
          </div>
          <div class="a-box ${isHidden ? 'hidden-study' : ''}" onclick="revealAnswer(${item.num})">
            <span class="a-reveal-prompt">🎁 ¡Toca aquí para ver la respuesta!</span>
            <div class="a-content">${formatAnswerHtml(item.a)}</div>
          </div>
        </article>
      `;
    }).join('');
    return `
      <div class="page ${sideClass}">
        <div class="page-header">
          <span class="page-part-tag" style="color:${th.color}"><span class="page-part-dot" style="background:${th.color}"></span>${escapeHtml(p.part.label)} · ${escapeHtml(p.part.title)}</span>
          <span class="page-range">#${p.items[0].num}–#${p.items[p.items.length-1].num}</span>
        </div>
        <div class="page-body">${cards}</div>
        <div class="page-footer"><span>Concurso Don Bosco 2027 · Primaria Mayor</span><span>Pág. ${pageIdx}</span></div>
      </div>
    `;
  }

  return `
    <div class="page ${sideClass}">
      <div class="cover-page" style="background:linear-gradient(155deg, #1D4ED8, #0D9488);">
        <div class="cover-logos"><img src="${ESFER_URI}" alt="ESFER" /><img src="${PASTORAL_URI}" alt="Pastoral" /></div>
        <div style="z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;">
          <div style="font-size:54px;">🏆</div>
          <h2 class="cover-title" style="font-size:32px;">¡EXCELENTE TRABAJO!</h2>
          <p class="cover-desc">Llevas <strong style="color:#FEF08A;">⭐ ${masteredSet.size} de 70 estrellas</strong> dominadas. ¡Pon a prueba lo aprendido!</p>
          <button class="cover-cta" onclick="openQuizModal()">🎮 ¡Jugar Reto de 10!</button>
        </div>
        <div style="z-index:2;font-size:12px;color:#CCFBF1;font-weight:800;">¡Estar siempre alegres es el secreto de Don Bosco!</div>
      </div>
    </div>
  `;
}

function renderView(animDir) {
  const shell = document.getElementById('bookShell');
  const spreadEl = document.getElementById('bookSpread');
  const scrubber = document.getElementById('pageScrubber');
  const indicator = document.getElementById('pageIndicator');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');

  if (isMobile) {
    shell.classList.add('single-cover');
    spreadEl.className = 'book-spread is-single' + (animDir ? ' flip-' + animDir : '');
    spreadEl.innerHTML = renderSinglePage(currentMobilePageIdx, '');
    scrubber.max = pages.length - 1; scrubber.value = currentMobilePageIdx;
    indicator.textContent = currentMobilePageIdx === 0 ? 'Portada' : (currentMobilePageIdx === pages.length - 1 ? 'Final' : `Pág. ${currentMobilePageIdx} / ${pages.length - 1}`);
    btnPrev.disabled = currentMobilePageIdx <= 0; btnNext.disabled = currentMobilePageIdx >= pages.length - 1;
  } else {
    const sp = spreads[currentSpreadIdx] || [0];
    const isSingle = sp.length === 1;
    shell.classList.toggle('single-cover', isSingle);
    spreadEl.className = 'book-spread ' + (isSingle ? 'is-single' : 'is-spread') + (animDir ? ' flip-' + animDir : '');
    spreadEl.innerHTML = isSingle ? renderSinglePage(sp[0], '') : (renderSinglePage(sp[0], 'left') + renderSinglePage(sp[1], 'right'));
    scrubber.max = spreads.length - 1; scrubber.value = currentSpreadIdx;
    indicator.textContent = currentSpreadIdx === 0 ? 'Portada' : (isSingle ? 'Final' : `Págs. ${sp[0]}–${sp[sp.length - 1]}`);
    btnPrev.disabled = currentSpreadIdx <= 0; btnNext.disabled = currentSpreadIdx >= spreads.length - 1;
  }
}

function goNext() {
  if (isMobile) { if (currentMobilePageIdx < pages.length - 1) { currentMobilePageIdx++; renderView('next'); } }
  else { if (currentSpreadIdx < spreads.length - 1) { currentSpreadIdx++; renderView('next'); } }
}
function goPrev() {
  if (isMobile) { if (currentMobilePageIdx > 0) { currentMobilePageIdx--; renderView('prev'); } }
  else { if (currentSpreadIdx > 0) { currentSpreadIdx--; renderView('prev'); } }
}
function goToPage(pageIdx, qNum = null) {
  closeModals(); highlightedQ = qNum;
  if (isMobile) currentMobilePageIdx = Math.max(0, Math.min(pages.length - 1, pageIdx));
  else { const idx = spreads.findIndex(sp => sp.includes(pageIdx)); currentSpreadIdx = idx >= 0 ? idx : 0; }
  renderView('next');
}
function toggleMastered(num) {
  if (masteredSet.has(num)) masteredSet.delete(num); else masteredSet.add(num);
  saveMastered(); renderView();
}
function revealAnswer(num) {
  if (!studyMode || revealedInStudy.has(num)) return;
  revealedInStudy.add(num); renderView();
}

function closeModals() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); }

function openTocModal() {
  const body = document.getElementById('tocModalBody');
  body.innerHTML = BOOK_DATA.parts.map(part => {
    const th = PART_THEMES[part.id];
    const qs = BOOK_DATA.questions.filter(q => q.part === part.id);
    const done = qs.filter(q => masteredSet.has(q.num)).length;
    const pct = Math.round((done / qs.length) * 100);
    const target = pages.findIndex(pg => pg.type === 'chapter' && pg.part.id === part.id);
    return `
      <button class="toc-card" onclick="goToPage(${target})">
        <div class="toc-num" style="background:${th.color}">${th.emoji}</div>
        <div class="toc-info">
          <div class="toc-title">${escapeHtml(part.label)}: ${escapeHtml(part.title)}</div>
          <div class="toc-meta">Preguntas #${qs[0].num}–#${qs[qs.length-1].num} · ⭐ ${done}/${qs.length} listas (${pct}%)</div>
          <div class="toc-prog-bar"><div class="toc-prog-fill" style="width:${pct}%;background:${th.color}"></div></div>
        </div>
        <span style="color:#64748B;font-weight:900;">→</span>
      </button>
    `;
  }).join('');
  document.getElementById('modalToc').classList.add('open');
}

function normStr(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function renderSearch(val) {
  const box = document.getElementById('searchResults');
  const q = normStr(val.trim());
  if (!q) { box.innerHTML = `<p style="font-size:13px;color:#64748B;text-align:center;padding:10px;">Escribe una palabra o número (1–70).</p>`; return; }
  const hits = BOOK_DATA.questions.filter(x => String(x.num) === q || normStr(x.q).includes(q) || normStr(x.a).includes(q)).slice(0, 20);
  if (!hits.length) { box.innerHTML = `<p style="font-size:13px;color:#64748B;text-align:center;padding:12px;">Sin resultados para «${escapeHtml(val)}».</p>`; return; }
  box.innerHTML = hits.map(it => {
    const pg = pages.findIndex(p => p.type === 'questions' && p.items.some(y => y.num === it.num));
    return `<div class="search-item" onclick="goToPage(${pg}, ${it.num})"><div style="font-weight:800;font-size:13px;color:#0F172A;">#${it.num} · ${escapeHtml(it.q)}</div><div style="font-size:12px;color:#475569;margin-top:2px;">${escapeHtml(it.a)}</div></div>`;
  }).join('');
}

let qPool = [], qIdx = 0, qOk = 0, qShow = false;
function openQuizModal() {
  qPool = [...BOOK_DATA.questions].sort(() => Math.random() - 0.5).slice(0, 10);
  qIdx = 0; qOk = 0; qShow = false;
  renderQuiz();
  document.getElementById('modalQuiz').classList.add('open');
}
function renderQuiz() {
  const b = document.getElementById('quizModalBody');
  if (qIdx >= qPool.length) {
    b.innerHTML = `
      <div style="text-align:center;padding:12px 4px;">
        <div style="font-size:56px;">🏆</div>
        <h3 class="display" style="font-size:26px;color:#0F766E;margin-top:6px;">¡${qOk} de 10 Aciertos!</h3>
        <p style="font-size:14px;color:#475569;font-weight:700;margin-top:6px;">¡Gran trabajo! Sigue practicando para el concurso.</p>
        <div class="quiz-actions" style="margin-top:16px;">
          <button class="qbtn primary" onclick="openQuizModal()">🔄 Nuevo Reto</button>
          <button class="qbtn miss" onclick="closeModals()">📖 Volver al Libro</button>
        </div>
      </div>`;
    return;
  }
  const it = qPool[qIdx], th = PART_THEMES[it.part];
  b.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:#64748B;">
      <span>Pregunta ${qIdx+1} de 10 (Banco #${it.num})</span>
      <span style="color:#059669;">⭐ ${qOk} aciertos</span>
    </div>
    <div style="background:#FFF;border:2px solid #E2E8F0;border-radius:16px;padding:16px;">
      <span style="font-size:11px;font-weight:800;color:${th.color};">${th.emoji} Capítulo ${it.part}</span>
      <div class="display" style="font-size:17px;color:#0F172A;margin-top:6px;line-height:1.35;">${escapeHtml(it.q)}</div>
      ${qShow ? `
        <div style="margin-top:12px;padding:12px;border-radius:12px;background:#FEF3C7;border:1.5px solid #F59E0B;font-size:13.5px;font-weight:700;color:#1E293B;">
          ${formatAnswerHtml(it.a)}
        </div>
        <div class="quiz-actions">
          <button class="qbtn ok" onclick="ansQuiz(true)">⭐ ¡Sí la supe!</button>
          <button class="qbtn miss" onclick="ansQuiz(false)">💪 Repasar</button>
        </div>
      ` : `
        <div class="quiz-actions"><button class="qbtn primary" onclick="qShow=true;renderQuiz();">🎁 Ver Respuesta</button></div>
      `}
    </div>`;
}
function ansQuiz(ok) {
  if (ok) { qOk++; masteredSet.add(qPool[qIdx].num); saveMastered(); }
  qIdx++; qShow = false; renderQuiz();
}

function printBook() {
  closeModals();
  const host = document.getElementById('printDocument');
  if (host.dataset.ready !== '1') {
    let html = `
      <div class="p-cover">
        <img src="${ESFER_URI}" alt="ESFER" />
        <div class="p-cover-title">
          <h1>CONCURSO DON BOSCO 2027 · PRIMARIA MAYOR</h1>
          <p>BANCO OFICIAL DE PREGUNTAS Y RESPUESTAS (70 PREGUNTAS)</p>
        </div>
        <img src="${PASTORAL_URI}" alt="Pastoral" />
      </div>`;
    BOOK_DATA.parts.forEach(part => {
      const th = PART_THEMES[part.id];
      const qs = BOOK_DATA.questions.filter(q => q.part === part.id);
      html += `<div class="p-part-header" style="background:${th.color};"><h2>${escapeHtml(part.label)}: ${escapeHtml(part.title)}</h2></div>`;
      qs.forEach(it => {
        html += `<div class="p-item" style="border-left-color:${th.color};"><div class="p-q">${it.num}. ${escapeHtml(it.q)}</div><div class="p-a">R: ${formatAnswerHtml(it.a)}</div></div>`;
      });
    });
    host.innerHTML = html; host.dataset.ready = '1';
  }
  setTimeout(() => window.print(), 120);
}

document.getElementById('btnPrev').addEventListener('click', goPrev);
document.getElementById('btnNext').addEventListener('click', goNext);
document.getElementById('btnHome').addEventListener('click', () => goToPage(0));
document.getElementById('btnToc').addEventListener('click', openTocModal);
document.getElementById('btnQuiz').addEventListener('click', openQuizModal);
document.getElementById('btnPrint').addEventListener('click', printBook);
document.getElementById('btnSearch').addEventListener('click', () => {
  document.getElementById('modalSearch').classList.add('open');
  const inp = document.getElementById('searchInput'); inp.value = ''; renderSearch(''); setTimeout(() => inp.focus(), 80);
});
document.getElementById('searchInput').addEventListener('input', e => renderSearch(e.target.value));
document.getElementById('btnStudy').addEventListener('click', () => {
  studyMode = !studyMode; revealedInStudy.clear();
  document.getElementById('btnStudy').classList.toggle('active', studyMode);
  renderView();
});
document.getElementById('pageScrubber').addEventListener('input', e => {
  const v = parseInt(e.target.value, 10); highlightedQ = null;
  if (isMobile) currentMobilePageIdx = v; else currentSpreadIdx = v;
  renderView();
});
document.querySelectorAll('.overlay').forEach(ov => ov.addEventListener('click', e => { if (e.target === ov) closeModals(); }));
document.addEventListener('keydown', e => {
  if (document.querySelector('.overlay.open')) { if (e.key === 'Escape') closeModals(); return; }
  if (e.key === 'ArrowRight') goNext(); if (e.key === 'ArrowLeft') goPrev();
});

let tx = 0, ty = 0;
document.getElementById('stage').addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; ty = e.changedTouches[0].screenY; }, { passive: true });
document.getElementById('stage').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - tx, dy = e.changedTouches[0].screenY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) { if (dx < 0) goNext(); else goPrev(); }
}, { passive: true });

window.addEventListener('resize', () => {
  const m = window.innerWidth <= 900;
  if (m !== isMobile) {
    if (m) currentMobilePageIdx = (spreads[currentSpreadIdx] && spreads[currentSpreadIdx][0]) || 0;
    else { const idx = spreads.findIndex(sp => sp.includes(currentMobilePageIdx)); currentSpreadIdx = idx >= 0 ? idx : 0; }
    isMobile = m; renderView();
  }
});

buildBookStructure();
saveMastered();
renderView();
</script>
</body>
</html>
