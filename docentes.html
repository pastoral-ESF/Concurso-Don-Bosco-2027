<style>
  :root {
    --navy: #162044;
    --navy-deep: #0B1124;
    --gold: #F59E0B;
    --gold-light: #FDE68A;
    --sky: #00ADEF;
    --paper: #FDFBF7;
    --paper-edge: #F2ECE1;
    --ink: #1E293B;
    --muted: #64748B;
    --shadow-book: 0 28px 65px rgba(0, 0, 0, 0.58), 0 8px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at 50% 25%, #4C1D3D 0%, #1F122B 58%, #0B0814 100%);
    color: #F8FAFC;
    overflow: hidden;
    user-select: none;
  }

  .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }

  /* ===== TOP BAR ===== */
  .topbar {
    height: 58px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: rgba(11, 17, 36, 0.82);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    position: relative;
    z-index: 40;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .brand img { height: 32px; width: auto; border-radius: 6px; background: rgba(255,255,255,0.92); padding: 2px 5px; }
  .brand-text { min-width: 0; }
  .brand-title { font-weight: 800; font-size: 13.5px; letter-spacing: 0.02em; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { font-size: 10.5px; color: #94A3B8; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .toolbar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .tb-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 11px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.13);
    background: rgba(255, 255, 255, 0.07);
    color: #E2E8F0;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .tb-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.25); transform: translateY(-1px); }
  .tb-btn.active { background: #F59E0B; color: #0F172A; border-color: #FDE68A; box-shadow: 0 0 16px rgba(245, 158, 11, 0.4); }
  .tb-btn.accent { background: linear-gradient(135deg, #00ADEF, #2563EB); color: #FFF; border-color: rgba(255,255,255,0.25); }
  .tb-btn.accent:hover { filter: brightness(1.1); }
  .tb-btn .lbl { display: inline; }

  .progress-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.14);
    border: 1px solid rgba(16, 185, 129, 0.35);
    color: #6EE7B7;
    font-size: 11.5px;
    font-weight: 800;
  }

  /* ===== STAGE / BOOK CONTAINER ===== */
  .stage {
    height: calc(100% - 114px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 14px 58px;
    perspective: 2200px;
    overflow: hidden;
  }

  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(8px);
    color: #FFFFFF;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 25;
    transition: all 0.2s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .nav-arrow:hover:not(:disabled) { background: #F59E0B; color: #0F172A; border-color: #FDE68A; transform: translateY(-50%) scale(1.08); }
  .nav-arrow:disabled { opacity: 0.22; cursor: not-allowed; }
  .nav-arrow.prev { left: 10px; }
  .nav-arrow.next { right: 10px; }

  .book-shell {
    width: 100%;
    max-width: 1120px;
    height: 100%;
    max-height: 700px;
    display: flex;
    align-items: stretch;
    justify-content: center;
    position: relative;
    transform-style: preserve-3d;
  }

  .book-shell.single-cover {
    max-width: 540px;
  }

  /* Realistic stacked paper edge effect behind book */
  .book-spread {
    width: 100%;
    height: 100%;
    display: flex;
    position: relative;
    border-radius: 14px;
    box-shadow: var(--shadow-book);
    background: var(--paper-edge);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    transform-style: preserve-3d;
  }

  .book-spread.flip-next {
    animation: flipNextAnim 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .book-spread.flip-prev {
    animation: flipPrevAnim 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes flipNextAnim {
    0%   { transform: rotateY(0deg) scale(1); }
    40%  { transform: rotateY(-12deg) scale(0.985); }
    100% { transform: rotateY(0deg) scale(1); }
  }
  @keyframes flipPrevAnim {
    0%   { transform: rotateY(0deg) scale(1); }
    40%  { transform: rotateY(12deg) scale(0.985); }
    100% { transform: rotateY(0deg) scale(1); }
  }

  /* Spine shadow in center of spread */
  .book-spread.is-spread::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 34px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, rgba(15,23,42,0) 0%, rgba(15,23,42,0.14) 46%, rgba(15,23,42,0.22) 50%, rgba(15,23,42,0.12) 54%, rgba(15,23,42,0) 100%);
    pointer-events: none;
    z-index: 12;
  }

  .page {
    flex: 1;
    width: 50%;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: text;
  }

  .book-spread.is-spread .page.left {
    border-radius: 14px 0 0 14px;
    border-right: 1px solid rgba(15, 23, 42, 0.08);
    box-shadow: inset -6px 0 12px rgba(15, 23, 42, 0.04);
  }
  .book-spread.is-spread .page.right {
    border-radius: 0 14px 14px 0;
    box-shadow: inset 6px 0 12px rgba(15, 23, 42, 0.04);
  }
  .book-spread.is-single .page {
    width: 100%;
    border-radius: 14px;
  }

  /* ===== COVER PAGE ===== */
  .cover-page {
    background: linear-gradient(155deg, #881337 0%, #3B0726 52%, #140818 100%);
    color: #FFFFFF;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    height: 100%;
  }
  .cover-page::before {
    content: '';
    position: absolute;
    inset: 14px;
    border: 1.5px solid rgba(251, 176, 59, 0.42);
    border-radius: 10px;
    pointer-events: none;
  }
  .cover-page::after {
    content: '';
    position: absolute;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.22) 0%, rgba(0, 173, 239, 0.08) 45%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -52%);
    pointer-events: none;
  }
  .cover-logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 2;
  }
  .cover-logos img {
    height: 44px;
    width: auto;
    background: rgba(255, 255, 255, 0.95);
    padding: 4px 10px;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
  }
  .cover-center {
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    max-width: 420px;
  }
  .cover-kicker {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 999px;
    background: rgba(245, 158, 11, 0.16);
    border: 1px solid rgba(251, 176, 59, 0.55);
    color: #FDE68A;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .cover-title {
    font-size: clamp(28px, 3.6vw, 42px);
    line-height: 1.08;
    font-weight: 900;
    background: linear-gradient(180deg, #FFFFFF 20%, #FDE68A 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.01em;
  }
  .cover-desc {
    font-size: 13px;
    line-height: 1.55;
    color: #CBD5E1;
    font-weight: 500;
  }
  .cover-cta {
    margin-top: 6px;
    padding: 13px 28px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #F59E0B, #D97706);
    color: #0F172A;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(245, 158, 11, 0.42);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .cover-cta:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.06); }
  .cover-footer {
    z-index: 2;
    font-size: 11px;
    color: #94A3B8;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  /* ===== PAGE HEADER & FOOTER ===== */
  .page-header {
    padding: 14px 24px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1.5px solid rgba(15, 23, 42, 0.08);
    flex-shrink: 0;
  }
  .page-part-tag {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .page-part-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .page-range { font-size: 10.5px; font-weight: 700; color: #64748B; }

  .page-body {
    flex: 1;
    padding: 14px 24px 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .page-body::-webkit-scrollbar { width: 5px; }
  .page-body::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.25); border-radius: 99px; }

  .page-footer {
    padding: 8px 24px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10.5px;
    color: #94A3B8;
    font-weight: 700;
    border-top: 1px solid rgba(15, 23, 42, 0.06);
    flex-shrink: 0;
  }
  .page-num-badge {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    color: #475569;
    font-size: 12px;
  }

  /* ===== TOC PAGE ===== */
  .toc-intro {
    background: linear-gradient(135deg, #EFF6FF, #FEF3C7);
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 11.8px;
    line-height: 1.5;
    color: #334155;
  }
  .toc-list { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
  .toc-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 13px;
    border-radius: 12px;
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    cursor: pointer;
    transition: all 0.18s ease;
    text-align: left;
  }
  .toc-card:hover { transform: translateX(4px); border-color: #CBD5E1; box-shadow: 0 4px 14px rgba(15,23,42,0.06); }
  .toc-num {
    width: 34px; height: 34px;
    border-radius: 10px;
    color: #FFF;
    font-weight: 900;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .toc-info { flex: 1; min-width: 0; }
  .toc-title { font-weight: 800; font-size: 12.5px; color: #0F172A; line-height: 1.25; }
  .toc-meta { font-size: 10.5px; color: #64748B; font-weight: 600; margin-top: 2px; }
  .toc-prog-bar { height: 4px; background: #E2E8F0; border-radius: 99px; overflow: hidden; margin-top: 5px; }
  .toc-prog-fill { height: 100%; border-radius: 99px; transition: width 0.3s ease; }

  /* ===== CHAPTER OPENER PAGE ===== */
  .chapter-opener {
    height: 100%;
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    color: #FFFFFF;
    overflow: hidden;
  }
  .chapter-opener::before {
    content: '';
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 10px;
    pointer-events: none;
  }
  .ch-top { z-index: 2; display: flex; align-items: center; justify-content: space-between; }
  .ch-pill {
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.28);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .ch-middle { z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 0 8px; }
  .ch-emblem {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(253, 230, 138, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.22);
  }
  .ch-title { font-size: clamp(22px, 2.5vw, 30px); line-height: 1.15; font-weight: 900; }
  .ch-subtitle { font-size: 12.5px; line-height: 1.55; color: rgba(255,255,255,0.88); max-width: 380px; }
  .ch-quote {
    z-index: 2;
    padding: 13px 16px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.22);
    border-left: 3px solid #FDE68A;
    font-style: italic;
    font-size: 12px;
    line-height: 1.5;
    color: #FEF3C7;
  }

  /* ===== QUESTION CARD ===== */
  .q-card {
    background: #FFFFFF;
    border: 1px solid #E5E7EB;
    border-left: 4px solid var(--q-accent, #1E3A8A);
    border-radius: 11px;
    padding: 11px 13px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.035);
    transition: all 0.2s ease;
  }
  .q-card.highlighted {
    box-shadow: 0 0 0 3px #F59E0B, 0 8px 20px rgba(245, 158, 11, 0.25);
    background: #FFFBEB;
  }
  .q-card.mastered {
    background: #F0FDF4;
    border-color: #BBF7D0;
  }

  .q-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .q-num-wrap {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    flex: 1;
  }
  .q-num {
    min-width: 26px;
    height: 22px;
    padding: 0 6px;
    border-radius: 6px;
    background: var(--q-accent, #1E3A8A);
    color: #FFFFFF;
    font-size: 11px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .q-text {
    font-size: 12.6px;
    font-weight: 800;
    color: #0F172A;
    line-height: 1.38;
  }
  .master-btn {
    border: 1px solid #CBD5E1;
    background: #F8FAFC;
    color: #64748B;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .master-btn:hover { border-color: #10B981; color: #059669; }
  .master-btn.done { background: #10B981; border-color: #10B981; color: #FFFFFF; }

  .a-box {
    font-size: 12.1px;
    line-height: 1.5;
    color: #334155;
    padding: 7px 10px;
    border-radius: 8px;
    background: #F8FAFC;
    border: 1px solid #F1F5F9;
    position: relative;
  }
  .a-box ul {
    margin: 5px 0 2px 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .a-box li { line-height: 1.42; }

  .a-box.hidden-study {
    cursor: pointer;
    background: linear-gradient(135deg, #F1F5F9, #E2E8F0);
    border: 1px dashed #94A3B8;
    text-align: center;
    padding: 10px;
  }
  .a-box.hidden-study .a-content { display: none; }
  .a-box.hidden-study .a-reveal-prompt {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 800;
    color: #334155;
  }
  .a-box:not(.hidden-study) .a-reveal-prompt { display: none; }

  /* ===== BOTTOM BAR ===== */
  .bottombar {
    height: 56px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(11, 17, 36, 0.85);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    position: relative;
    z-index: 40;
  }
  .scrubber-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 680px;
  }
  .page-indicator {
    font-size: 12px;
    font-weight: 800;
    color: #FDE68A;
    white-space: nowrap;
    min-width: 92px;
    text-align: center;
  }
  input[type="range"].scrubber {
    flex: 1;
    accent-color: #F59E0B;
    height: 6px;
    cursor: pointer;
  }

  /* ===== DRAWERS / MODALS ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(7, 11, 24, 0.72);
    backdrop-filter: blur(6px);
    z-index: 80;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .overlay.open { display: flex; }

  .modal-box {
    width: 100%;
    max-width: 580px;
    max-height: 86vh;
    background: #FFFFFF;
    color: #0F172A;
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: popIn 0.2s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-head {
    padding: 16px 20px;
    background: #141E46;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-head h3 { font-size: 16px; font-weight: 800; }
  .modal-close {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.14);
    color: #FFF;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-body {
    padding: 16px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .search-input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 2px solid #CBD5E1;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    outline: none;
  }
  .search-input:focus { border-color: #2563EB; }

  .search-item {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #E2E8F0;
    background: #F8FAFC;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .search-item:hover { background: #EFF6FF; border-color: #93C5FD; }
  .search-item-q { font-size: 12.5px; font-weight: 800; color: #0F172A; }
  .search-item-a { font-size: 11.5px; color: #475569; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ===== QUIZ MODAL ===== */
  .quiz-card {
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 14px;
    padding: 16px;
  }
  .quiz-q { font-size: 15px; font-weight: 800; color: #0F172A; line-height: 1.45; margin-top: 8px; }
  .quiz-a {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #FFFBEB;
    border: 1px solid #FDE68A;
    font-size: 13px;
    line-height: 1.5;
    color: #1E293B;
  }
  .quiz-actions { display: flex; gap: 10px; margin-top: 14px; }
  .qbtn {
    flex: 1;
    padding: 11px 14px;
    border-radius: 11px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .qbtn:hover { transform: translateY(-1px); }
  .qbtn.primary { background: #1E3A8A; color: #FFF; }
  .qbtn.ok { background: #10B981; color: #FFF; }
  .qbtn.miss { background: #EF4444; color: #FFF; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .stage { padding: 10px 10px; }
    .nav-arrow { width: 36px; height: 36px; font-size: 16px; opacity: 0.85; }
    .nav-arrow.prev { left: 4px; }
    .nav-arrow.next { right: 4px; }
    .tb-btn .lbl { display: none; }
    .tb-btn { padding: 0 9px; }
    .brand-sub { display: none; }
    .page-header, .page-body, .page-footer { padding-left: 16px; padding-right: 16px; }
  }

  /* ===== PRINTABLE / PDF VERSION ===== */
  .print-only { display: none; }

  @media print {
    @page { size: letter; margin: 1.3cm 1.4cm; }
    html, body {
      height: auto !important;
      overflow: visible !important;
      background: #FFFFFF !important;
      color: #0F172A !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .topbar, .stage, .bottombar, .overlay { display: none !important; }
    .print-only { display: block !important; }

    .p-cover {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 3px solid #1E3A8A;
    }
    .p-cover img { height: 42px; width: auto; }
    .p-cover-title { text-align: center; flex: 1; }
    .p-cover-title h1 { font-size: 20px; color: #1E3A8A; margin: 0; line-height: 1.15; }
    .p-cover-title p { font-size: 10.5px; color: #475569; margin-top: 3px; font-weight: 600; }

    .p-part-header {
      margin: 16px 0 8px;
      padding: 8px 12px;
      border-radius: 8px;
      color: #FFFFFF;
      break-after: avoid;
      page-break-after: avoid;
    }
    .p-part-header h2 { font-size: 13.5px; margin: 0; font-weight: 800; }
    .p-part-header p { font-size: 10px; margin-top: 2px; opacity: 0.92; }

    .p-item {
      border: 1px solid #E2E8F0;
      border-left: 3.5px solid #1E3A8A;
      border-radius: 6px;
      padding: 7px 10px;
      margin-bottom: 7px;
      background: #FFFFFF;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .p-q { font-size: 11px; font-weight: 800; color: #0F172A; line-height: 1.35; margin-bottom: 3px; }
    .p-a { font-size: 10.5px; color: #334155; line-height: 1.42; }
    .p-a ul { margin: 3px 0 1px 16px; }
    .p-a li { margin-bottom: 1px; }
  }
</style>
</head>
